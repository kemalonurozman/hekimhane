<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Biri içe kaymış iki göz, altın çerçeveli gözlük ve tembel göz tedavisinde kullanılan göz bandı">
  <defs>
    <linearGradient id="sas_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="sas_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="sas_white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
    <radialGradient id="sas_iris" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6F8DB8"/><stop offset="0.75" stop-color="#3B5F94"/><stop offset="1" stop-color="#1E3D6B"/></radialGradient>
    <radialGradient id="sas_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <clipPath id="sas_eyeL"><path transform="translate(470 330)" d="M-110 0 C -62 -72 62 -72 110 0 C 62 72 -62 72 -110 0 Z"/></clipPath>
    <clipPath id="sas_eyeR"><path transform="translate(730 330)" d="M-110 0 C -62 -72 62 -72 110 0 C 62 72 -62 72 -110 0 Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#sas_bg)"/>
  <rect width="1200" height="675" fill="url(#sas_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1000" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Bakış hizası -->
  <line x1="300" y1="330" x2="900" y2="330" stroke="#9DB4D6" stroke-width="2" stroke-dasharray="4 10" opacity="0.4"/>

  <!-- Gözler -->
  <path transform="translate(470 330)" d="M-110 0 C -62 -72 62 -72 110 0 C 62 72 -62 72 -110 0 Z" fill="url(#sas_white)"/>
  <path transform="translate(730 330)" d="M-110 0 C -62 -72 62 -72 110 0 C 62 72 -62 72 -110 0 Z" fill="url(#sas_white)"/>
  <g clip-path="url(#sas_eyeL)">
    <circle cx="470" cy="330" r="46" fill="url(#sas_iris)"/>
    <circle cx="470" cy="330" r="19" fill="#0E2240"/>
    <circle cx="456" cy="316" r="8" fill="#fff" opacity="0.85"/>
  </g>
  <g clip-path="url(#sas_eyeR)">
    <circle cx="684" cy="330" r="46" fill="url(#sas_iris)"/>
    <circle cx="684" cy="330" r="19" fill="#0E2240"/>
    <circle cx="670" cy="316" r="8" fill="#fff" opacity="0.85"/>
  </g>
  <g fill="none" stroke="#C7D2E4" stroke-width="5" stroke-linecap="round">
    <path transform="translate(470 330)" d="M-110 0 C -62 -72 62 -72 110 0"/>
    <path transform="translate(730 330)" d="M-110 0 C -62 -72 62 -72 110 0"/>
  </g>
  <!-- Kaşlar -->
  <g fill="none" stroke="#9DB4D6" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <path d="M384 222 C 430 196 510 196 556 216"/>
    <path d="M644 216 C 690 196 770 196 816 222"/>
  </g>

  <!-- Gözlük -->
  <g fill="none" stroke="url(#sas_gold)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <rect x="344" y="244" width="252" height="176" rx="64"/>
    <rect x="604" y="244" width="252" height="176" rx="64"/>
    <path d="M572 276 C 588 258 612 258 628 276"/>
    <path d="M344 290 L 300 278"/>
    <path d="M856 290 L 900 278"/>
  </g>

  <!-- Kayma oku -->
  <path d="M740 398 C 728 408 712 410 698 404" fill="none" stroke="#E8C56A" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M688 399 L 701 397 L 697 410 Z" fill="#E8C56A" opacity="0.85"/>

  <!-- Göz bandı -->
  <g transform="translate(980 520) rotate(-14)">
    <path d="M-92 0 C -92 -50 -44 -62 0 -62 C 44 -62 92 -50 92 0 C 92 50 44 62 0 62 C -44 62 -92 50 -92 0 Z" fill="#E4EAF3"/>
    <path d="M-58 0 C -58 -32 -28 -40 0 -40 C 28 -40 58 -32 58 0 C 58 32 28 40 0 40 C -28 40 -58 32 -58 0 Z" fill="#C7D2E4"/>
    <circle cx="-22" cy="-8" r="6" fill="url(#sas_gold)"/>
    <circle cx="14" cy="12" r="5" fill="url(#sas_gold)"/>
    <circle cx="26" cy="-16" r="4" fill="url(#sas_gold)"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
