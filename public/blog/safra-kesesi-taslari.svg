<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Karaciğerin altındaki armut biçimli safra kesesi, içinde altın renkli taşlar ve safra yolları şeması">
  <defs>
    <linearGradient id="sft_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="sft_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="sft_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="sft_liver" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="380"><stop offset="0" stop-color="#DCE4F0"/><stop offset="1" stop-color="#AFC0DA"/></linearGradient>
    <linearGradient id="sft_gb" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="530"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#D5DEEC"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sft_bg)"/>
  <rect width="1200" height="675" fill="url(#sft_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Odak halkası -->
  <g fill="none" stroke="url(#sft_gold)" stroke-linecap="round">
    <circle cx="505" cy="440" r="128" stroke-width="2.5" stroke-dasharray="3 12" opacity="0.5"/>
    <circle cx="505" cy="440" r="168" stroke-width="2" stroke-dasharray="2 14" opacity="0.28"/>
  </g>

  <!-- Karaciğer -->
  <path d="M300 205 C 320 140 520 118 720 132 C 860 142 965 165 985 200 C 1000 228 905 255 805 288 C 725 315 645 345 565 362 C 470 380 360 375 320 332 C 288 296 284 245 300 205 Z" fill="url(#sft_liver)"/>
  <path d="M640 136 C 650 200 660 260 650 330" fill="none" stroke="#8EA2C2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M345 190 C 420 160 540 150 620 158" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.4"/>

  <!-- Onikiparmak bağırsağı -->
  <path d="M830 452 C 720 440 650 480 648 545 C 646 605 715 632 830 622" fill="none" stroke="#9FB0CC" stroke-width="42" stroke-linecap="round" opacity="0.55"/>

  <!-- Safra yolları -->
  <g fill="none" stroke="#C7D2E4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M612 318 C 615 350 618 372 620 392 C 624 440 640 490 662 540" stroke-width="14"/>
    <path d="M556 352 C 575 360 600 372 620 392" stroke-width="10"/>
    <path d="M560 292 C 585 296 605 306 612 322" stroke-width="9" stroke="#8EA2C2"/>
    <path d="M672 288 C 645 294 620 306 612 322" stroke-width="9" stroke="#8EA2C2"/>
  </g>

  <!-- Safra kesesi -->
  <path d="M556 336 C 584 348 592 382 578 424 C 562 472 524 522 480 524 C 440 526 424 490 440 452 C 458 410 504 366 556 336 Z" fill="url(#sft_gb)" stroke="#9FB0CC" stroke-width="3"/>
  <path d="M532 372 C 506 392 478 420 462 450" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Taşlar -->
  <g fill="url(#sft_gold)" stroke="#A8802A" stroke-width="2" stroke-linejoin="round">
    <path d="M466 474 L 482 462 L 500 468 L 504 488 L 490 502 L 470 498 L 460 486 Z"/>
    <path d="M506 446 L 520 438 L 534 446 L 534 462 L 520 470 L 506 462 Z"/>
    <path d="M470 440 L 482 432 L 494 440 L 492 454 L 478 458 L 468 450 Z"/>
    <path d="M512 482 L 524 476 L 536 484 L 532 498 L 518 500 Z"/>
    <path d="M538 410 L 548 404 L 558 410 L 556 422 L 544 426 L 536 418 Z"/>
  </g>
  <g fill="#FFF7E0" opacity="0.7">
    <circle cx="478" cy="472" r="4"/><circle cx="516" cy="446" r="3"/><circle cx="478" cy="440" r="2.5"/>
  </g>

  <!-- Küçük kesi noktaları (kapalı yöntem) -->
  <g fill="none" stroke="url(#sft_gold)" stroke-width="4">
    <circle cx="880" cy="400" r="11"/><circle cx="935" cy="470" r="9"/><circle cx="905" cy="545" r="9"/>
  </g>
  <g fill="#E8C56A"><circle cx="880" cy="400" r="3.5"/><circle cx="935" cy="470" r="3"/><circle cx="905" cy="545" r="3"/></g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
