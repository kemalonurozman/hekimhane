<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="İşletmeniz için Hekimhane — klinik, konum ve doğrulanmış işletme rozeti simgesi">
  <defs>
    <linearGradient id="g_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="g_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="g_glow" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g_bg)"/>
  <rect width="1200" height="675" fill="url(#g_glow)"/>
  <circle cx="1050" cy="130" r="210" fill="#fff" opacity="0.035"/>
  <circle cx="160" cy="580" r="180" fill="#fff" opacity="0.03"/>

  <!-- Clinic building -->
  <g transform="translate(470 250)">
    <rect x="-150" y="60" width="300" height="230" rx="16" fill="#EEF2F8"/>
    <rect x="-150" y="60" width="300" height="46" rx="16" fill="#fff"/>
    <!-- Roof sign -->
    <rect x="-70" y="18" width="140" height="56" rx="12" fill="url(#g_gold)"/>
    <g fill="#12294B"><rect x="-8" y="30" width="16" height="32" rx="3"/><rect x="-16" y="38" width="32" height="16" rx="3"/></g>
    <!-- Windows -->
    <g fill="#C7D5EA"><rect x="-112" y="128" width="60" height="48" rx="8"/><rect x="-30" y="128" width="60" height="48" rx="8"/><rect x="52" y="128" width="60" height="48" rx="8"/></g>
    <!-- Door -->
    <rect x="-34" y="206" width="68" height="84" rx="10" fill="#1B3A69"/>
    <circle cx="20" cy="250" r="4" fill="url(#g_gold)"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(760 300)">
    <path d="M0 -70 C -46 -70 -80 -38 -80 6 C -80 58 0 118 0 118 C 0 118 80 58 80 6 C 80 -38 46 -70 0 -70 Z" fill="url(#g_gold)"/>
    <circle cx="0" cy="2" r="30" fill="#12294B"/>
    <path d="M-13 2 l 9 9 18 -20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Verified badge -->
  <g transform="translate(870 470)">
    <path d="M0 -46 l 12 -8 14 4 8 12 14 6 0 16 8 12 -8 12 0 16 -14 6 -8 12 -14 4 -12 -8 -12 8 -14 -4 -8 -12 -14 -6 0 -16 -8 -12 8 -12 0 -16 14 -6 8 -12 14 -4 z" fill="url(#g_gold)" transform="scale(0.9)"/>
    <path d="M-16 0 l 11 11 21 -24" fill="none" stroke="#12294B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
