<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Alt çene kemiği kesitinde planlanan implant silueti, üzerinde metal kılıflı cerrahi rehber ve altın renkli sanal kron gösteren şematik çizim">
  <defs>
    <linearGradient id="imdp_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="imdp_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="imdp_bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="imdp_metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DB4D6"/><stop offset="0.5" stop-color="#F2F5FA"/><stop offset="1" stop-color="#9DB4D6"/></linearGradient>
    <radialGradient id="imdp_glow" cx="0.58" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <clipPath id="imdp_kesit"><path d="M700 318 C 642 318 612 372 607 438 C 600 522 632 592 700 598 C 768 592 800 522 793 438 C 788 372 758 318 700 318 Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#imdp_bg)"/>
  <rect width="1200" height="675" fill="url(#imdp_glow)"/>
  <circle cx="1070" cy="585" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="170" cy="560" r="170" fill="#fff" opacity="0.025"/>

  <!-- Planlama ızgarası -->
  <g stroke="#9DB4D6" stroke-width="1" opacity="0.12">
    <line x1="470" y1="120" x2="470" y2="620"/><line x1="585" y1="120" x2="585" y2="620"/><line x1="815" y1="120" x2="815" y2="620"/><line x1="930" y1="120" x2="930" y2="620"/>
    <line x1="430" y1="200" x2="970" y2="200"/><line x1="430" y1="320" x2="970" y2="320"/><line x1="430" y1="440" x2="970" y2="440"/><line x1="430" y1="560" x2="970" y2="560"/>
  </g>

  <!-- Dişeti -->
  <path d="M592 330 C 610 300 650 290 700 290 C 750 290 790 300 808 330 L 800 352 C 780 330 745 322 700 322 C 655 322 620 330 600 352 Z" fill="#7E9AC2" opacity="0.75"/>

  <!-- Kemik kesiti: kortikal + spongioz -->
  <path d="M700 318 C 642 318 612 372 607 438 C 600 522 632 592 700 598 C 768 592 800 522 793 438 C 788 372 758 318 700 318 Z" fill="url(#imdp_bone)" opacity="0.95"/>
  <g clip-path="url(#imdp_kesit)" fill="#9DB4D6" opacity="0.35">
    <circle cx="640" cy="420" r="9"/><circle cx="668" cy="470" r="7"/><circle cx="640" cy="515" r="10"/><circle cx="672" cy="552" r="8"/>
    <circle cx="760" cy="410" r="8"/><circle cx="742" cy="462" r="10"/><circle cx="765" cy="505" r="7"/><circle cx="735" cy="548" r="9"/>
    <circle cx="655" cy="378" r="6"/><circle cx="748" cy="372" r="6"/>
  </g>
  <path d="M700 330 C 652 330 625 378 620 440 C 614 518 642 580 700 585 C 758 580 786 518 780 440 C 775 378 748 330 700 330 Z" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.6"/>

  <!-- Alt çene kanalı -->
  <circle cx="712" cy="566" r="15" fill="#2A4E82" stroke="#9DB4D6" stroke-width="2.5"/>

  <!-- Planlanan eksen -->
  <line x1="700" y1="110" x2="700" y2="545" stroke="#E8C56A" stroke-width="2" stroke-dasharray="9 8" opacity="0.8"/>

  <!-- İmplant -->
  <path d="M678 336 L 722 336 L 718 500 Q 716 522 700 526 Q 684 522 682 500 Z" fill="url(#imdp_metal)"/>
  <g stroke="#5D7DAA" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="680" y1="360" x2="720" y2="352"/><line x1="680" y1="384" x2="720" y2="376"/><line x1="681" y1="408" x2="719" y2="400"/>
    <line x1="681" y1="432" x2="719" y2="424"/><line x1="682" y1="456" x2="718" y2="448"/><line x1="683" y1="480" x2="717" y2="472"/>
  </g>
  <!-- Güvenlik payı -->
  <g stroke="#E8C56A" stroke-width="2.5" stroke-linecap="round">
    <line x1="752" y1="526" x2="752" y2="551"/><line x1="744" y1="526" x2="760" y2="526"/><line x1="744" y1="551" x2="760" y2="551"/>
  </g>

  <!-- Sanal kron -->
  <path d="M650 290 C 646 250 652 214 676 206 C 690 202 710 202 724 206 C 748 214 754 250 750 290 Z" fill="url(#imdp_gold)" opacity="0.22"/>
  <path d="M650 290 C 646 250 652 214 676 206 C 690 202 710 202 724 206 C 748 214 754 250 750 290 Z" fill="none" stroke="url(#imdp_gold)" stroke-width="4" stroke-dasharray="12 8" stroke-linejoin="round"/>
  <rect x="690" y="290" width="20" height="46" rx="4" fill="#C7D2E4" opacity="0.9"/>

  <!-- Komşu dişler -->
  <path d="M510 292 C 504 240 514 200 540 194 C 556 190 574 190 588 196 C 610 206 616 244 610 292 Z" fill="url(#imdp_bone)" opacity="0.9"/>
  <path d="M790 292 C 784 240 794 200 820 194 C 836 190 854 190 868 196 C 890 206 896 244 890 292 Z" fill="url(#imdp_bone)" opacity="0.9"/>

  <!-- Cerrahi rehber + kılıf -->
  <path d="M492 186 C 492 160 506 148 532 148 L 868 148 C 894 148 908 160 908 186 L 908 192 C 870 178 840 178 810 190 L 590 190 C 560 178 530 178 492 192 Z" fill="#EEF2F8" opacity="0.18"/>
  <path d="M492 186 C 492 160 506 148 532 148 L 868 148 C 894 148 908 160 908 186 L 908 192 C 870 178 840 178 810 190 L 590 190 C 560 178 530 178 492 192 Z" fill="none" stroke="#9DB4D6" stroke-width="2.5" opacity="0.85"/>
  <rect x="677" y="128" width="46" height="66" rx="6" fill="url(#imdp_metal)"/>
  <rect x="689" y="128" width="22" height="66" rx="3" fill="#12294B" opacity="0.85"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">DİJİTAL HEKİMLİK</text>
  </g>
</svg>
