<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Önden görülen baş siluetinde öne açılmış kulağın kesikli izi ve başa yaklaşan kulağı gösteren altın ok">
  <defs>
    <linearGradient id="kep_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="kep_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="kep_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="kep_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <marker id="kep_arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L 10 5 L 0 10 Z" fill="#E8C56A"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#kep_bg)"/>
  <rect width="1200" height="675" fill="url(#kep_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="140" cy="560" r="160" fill="#fff" opacity="0.025"/>

  <!-- Omuzlar ve boyun -->
  <path d="M370 700 C 380 600 470 566 548 552 L 652 552 C 730 566 820 600 830 700 Z" fill="#9DB4D6" opacity="0.55"/>
  <path d="M548 470 L 548 560 C 570 576 630 576 652 560 L 652 470 Z" fill="#C7D2E4"/>

  <!-- Öne açılmış kulakların kesikli izi -->
  <g fill="#F2F5FA" fill-opacity="0.06" stroke="#9DB4D6" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round">
    <path d="M462 262 C 396 222 340 252 342 318 C 344 380 392 414 466 408"/>
    <path d="M738 262 C 804 222 860 252 858 318 C 856 380 808 414 734 408"/>
  </g>

  <!-- Baş -->
  <ellipse cx="600" cy="320" rx="146" ry="182" fill="url(#kep_skin)"/>
  <!-- Saç -->
  <path d="M454 300 C 446 196 510 132 600 132 C 690 132 754 196 746 300 C 730 236 690 200 600 200 C 510 200 470 236 454 300 Z" fill="#9DB4D6" opacity="0.8"/>

  <!-- Başa yaklaşmış kulaklar -->
  <g fill="url(#kep_skin)">
    <path d="M458 270 C 430 262 414 290 416 326 C 418 366 432 400 462 402 C 456 360 454 310 458 270 Z"/>
    <path d="M742 270 C 770 262 786 290 784 326 C 782 366 768 400 738 402 C 744 360 746 310 742 270 Z"/>
  </g>
  <g fill="none" stroke="#9FB0CC" stroke-width="3.5" stroke-linecap="round">
    <path d="M446 290 C 432 300 430 340 440 370"/>
    <path d="M754 290 C 768 300 770 340 760 370"/>
  </g>

  <!-- Geri yaklaşma okları -->
  <g fill="none" stroke="url(#kep_gold)" stroke-width="6" stroke-linecap="round">
    <path d="M330 250 C 320 300 330 340 382 352" marker-end="url(#kep_arrow)"/>
    <path d="M870 250 C 880 300 870 340 818 352" marker-end="url(#kep_arrow)"/>
  </g>
  <!-- Açı göstergesi -->
  <g fill="none" stroke="url(#kep_gold)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7">
    <path d="M460 230 C 420 210 380 216 356 236"/>
    <path d="M740 230 C 780 210 820 216 844 236"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
