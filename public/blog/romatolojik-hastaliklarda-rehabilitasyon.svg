<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Romatolojik hastalıklarda rehabilitasyon — küçük eklemleri altın renkle vurgulanmış açık bir el, hareket okları ve yanında omurga çizimi">
  <defs>
    <linearGradient id="rom_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="rom_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="rom_glow" cx="0.45" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="rom_joint" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.55"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rom_bg)"/>
  <rect width="1200" height="675" fill="url(#rom_glow)"/>
  <circle cx="1060" cy="110" r="210" fill="#fff" opacity="0.035"/>
  <circle cx="150" cy="590" r="180" fill="#fff" opacity="0.03"/>

  <g transform="translate(-40 0)">
  <!-- Hareket oku (parmak uçlarının üstünde) -->
  <g fill="none" stroke="url(#rom_gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 250 C 400 120 620 100 672 222"/>
    <path d="M650 214 L 674 226 L 684 200"/>
  </g>

  <!-- El -->
  <g fill="#EEF2F8">
    <!-- Önkol / bilek -->
    <rect x="462" y="520" width="134" height="170" rx="44" opacity="0.92"/>
    <!-- Avuç -->
    <rect x="426" y="360" width="196" height="210" rx="62"/>
    <!-- Başparmak -->
    <line x1="458" y1="522" x2="374" y2="418" stroke="#EEF2F8" stroke-width="48" stroke-linecap="round"/>
    <!-- Parmaklar -->
    <rect x="428" y="222" width="44" height="190" rx="22"/>
    <rect x="478" y="196" width="44" height="214" rx="22"/>
    <rect x="528" y="210" width="44" height="200" rx="22"/>
    <rect x="578" y="258" width="40" height="150" rx="20"/>
  </g>
  <!-- Eklem çizgileri -->
  <g stroke="#C9D4E5" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="438" y1="272" x2="462" y2="272"/><line x1="438" y1="322" x2="462" y2="322"/>
    <line x1="488" y1="244" x2="512" y2="244"/><line x1="488" y1="300" x2="512" y2="300"/>
    <line x1="538" y1="258" x2="562" y2="258"/><line x1="538" y1="312" x2="562" y2="312"/>
    <line x1="587" y1="296" x2="609" y2="296"/><line x1="587" y1="338" x2="609" y2="338"/>
  </g>
  <!-- İltihaplı küçük eklemler -->
  <g>
    <circle cx="500" cy="300" r="34" fill="url(#rom_joint)"/>
    <circle cx="550" cy="384" r="34" fill="url(#rom_joint)"/>
    <circle cx="450" cy="384" r="34" fill="url(#rom_joint)"/>
    <circle cx="500" cy="300" r="11" fill="url(#rom_gold)"/>
    <circle cx="550" cy="384" r="11" fill="url(#rom_gold)"/>
    <circle cx="450" cy="384" r="11" fill="url(#rom_gold)"/>
    <circle cx="550" cy="312" r="7" fill="url(#rom_gold)" opacity="0.8"/>
  </g>

  </g>

  <!-- Omurga ve leğen -->
  <g transform="translate(850 0)">
    <circle cx="0" cy="360" r="190" fill="#2A4E82" opacity="0.35"/>
    <g fill="#DCE5F2">
      <rect x="-30" y="132" width="60" height="34" rx="11" transform="rotate(-4 0 149)"/>
      <rect x="-33" y="178" width="66" height="36" rx="12" transform="rotate(-2 0 196)"/>
      <rect x="-36" y="226" width="72" height="38" rx="12"/>
      <rect x="-38" y="276" width="76" height="40" rx="13" transform="rotate(2 0 296)"/>
      <rect x="-40" y="328" width="80" height="42" rx="13" transform="rotate(4 0 349)"/>
    </g>
    <g fill="#8FA6C9" opacity="0.85">
      <rect x="-24" y="167" width="48" height="9" rx="4.5"/>
      <rect x="-26" y="215" width="52" height="9" rx="4.5"/>
      <rect x="-28" y="265" width="56" height="9" rx="4.5"/>
      <rect x="-30" y="317" width="60" height="9" rx="4.5"/>
    </g>
    <!-- Sakrum ve iliak kanatlar -->
    <path d="M-44 382 L 44 382 L 26 470 Q 0 492 -26 470 Z" fill="#DCE5F2"/>
    <path d="M-52 386 C -120 360 -170 392 -168 456 C -166 500 -120 520 -84 506 L -40 470 Z" fill="#C7D2E4"/>
    <path d="M52 386 C 120 360 170 392 168 456 C 166 500 120 520 84 506 L 40 470 Z" fill="#C7D2E4"/>
    <!-- Sakroiliak eklemler -->
    <circle cx="-44" cy="420" r="30" fill="url(#rom_joint)"/>
    <circle cx="44" cy="420" r="30" fill="url(#rom_joint)"/>
    <path d="M-48 392 L -36 458" stroke="url(#rom_gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M48 392 L 36 458" stroke="url(#rom_gold)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
