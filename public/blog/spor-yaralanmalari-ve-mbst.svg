<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Spor yaralanmaları ve MBST — koşan stilize bir sporcu figürü, ön dizinin çevresinde altın renkli manyetik alan halkaları">
  <defs>
    <linearGradient id="spor_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="spor_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="spor_glow" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="spor_knee" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.5"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#spor_bg)"/>
  <rect width="1200" height="675" fill="url(#spor_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="150" cy="110" r="170" fill="#fff" opacity="0.03"/>

  <!-- Zemin ve hız çizgileri -->
  <line x1="300" y1="590" x2="960" y2="590" stroke="#9DB4D6" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <g stroke="#9DB4D6" stroke-width="6" stroke-linecap="round" opacity="0.35">
    <line x1="300" y1="250" x2="420" y2="250"/>
    <line x1="270" y1="310" x2="440" y2="310"/>
    <line x1="320" y1="370" x2="430" y2="370"/>
  </g>

  <!-- Manyetik alan halkaları (ön diz) -->
  <g transform="translate(690 440)">
    <circle r="120" fill="url(#spor_knee)"/>
    <circle r="54" fill="none" stroke="url(#spor_gold)" stroke-width="5"/>
    <circle r="86" fill="none" stroke="url(#spor_gold)" stroke-width="4" opacity="0.6" stroke-dasharray="14 12"/>
    <circle r="118" fill="none" stroke="url(#spor_gold)" stroke-width="3" opacity="0.32" stroke-dasharray="10 14"/>
  </g>

  <!-- Arkadaki uzuvlar -->
  <g fill="none" stroke="#9FB0CC" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="595,375 545,478 452,446"/>
    <polyline points="636,238 580,304 620,344"/>
  </g>
  <line x1="452" y1="446" x2="428" y2="484" stroke="#9FB0CC" stroke-width="22" stroke-linecap="round"/>

  <!-- Gövde ve baş -->
  <line x1="636" y1="236" x2="595" y2="372" stroke="#F2F5FA" stroke-width="54" stroke-linecap="round"/>
  <circle cx="662" cy="172" r="36" fill="#F2F5FA"/>

  <!-- Öndeki uzuvlar -->
  <g fill="none" stroke="#F2F5FA" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="595,375 690,440 660,556"/>
    <polyline points="636,238 684,306 740,272"/>
  </g>
  <line x1="652" y1="568" x2="712" y2="574" stroke="#F2F5FA" stroke-width="22" stroke-linecap="round"/>

  <!-- Diz eklemi vurgusu -->
  <circle cx="690" cy="440" r="11" fill="url(#spor_gold)"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
