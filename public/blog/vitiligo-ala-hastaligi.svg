<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Vitiligo (ala hastalığı) — açık renkli düzensiz alanlar içeren deri yüzeyi, alan içinde yeniden renklenen noktalar ve kenarlarda altın renkli pigment hücreleri">
