<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Sivilce (akne) — yağ ve hücre tıkacıyla dolmuş, çevresi iltihaplı gözenek ile yanında açık ve sağlıklı bir gözeneği gösteren stilize deri kesiti">
  <defs>
    <linearGradient id="akn_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="akn_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="akn_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="akn_infl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.45"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
    <linearGradient id="akn_derm" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="620"><stop offset="0" stop-color="#C7D2E4"/><stop offset="1" stop-color="#C7D2E4" stop-opacity="0.2"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#akn_bg)"/>
  <rect width="1200" height="675" fill="url(#akn_glow)"/>
  <circle cx="1070" cy="110" r="160" fill="#fff" opacity="0.025"/>
  <circle cx="140" cy="600" r="170" fill="#fff" opacity="0.025"/>

  <!-- Dermis -->
  <rect x="160" y="300" width="880" height="320" rx="24" fill="url(#akn_derm)"/>
  <!-- İltihap ışıması -->
  <circle cx="440" cy="420" r="170" fill="url(#akn_infl)"/>
  <!-- Epidermis (sol tarafta kabarık) -->
  <path d="M160 300 L 340 300 C 380 300 390 252 440 250 C 490 252 500 300 540 300 L 1040 300 L 1040 330 L 540 330 C 510 330 500 300 440 300 C 380 300 370 330 340 330 L 160 330 Z" fill="#F2F5FA"/>
  <path d="M160 300 L 340 300 C 380 300 390 252 440 250 C 490 252 500 300 540 300 L 1040 300" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>

  <!-- Sol: tıkalı ve genişlemiş kıl kökü -->
  <path d="M424 262 C 420 300 380 330 384 400 C 388 470 408 520 440 524 C 472 520 492 470 496 400 C 500 330 460 300 456 262 Z" fill="#E4EAF3" stroke="#9FB0CC" stroke-width="3"/>
  <!-- Yağ ve hücre tıkacı -->
  <path d="M428 266 C 426 300 400 330 402 392 C 404 450 420 494 440 496 C 460 494 476 450 478 392 C 480 330 454 300 452 266 Z" fill="url(#akn_gold)"/>
  <ellipse cx="440" cy="266" rx="14" ry="8" fill="#3E5A86"/>
  <g fill="#FFF3D1" opacity="0.8"><circle cx="428" cy="360" r="6"/><circle cx="452" cy="410" r="5"/><circle cx="434" cy="450" r="4"/></g>
  <!-- Büyümüş yağ bezleri -->
  <g fill="url(#akn_gold)" opacity="0.9">
    <circle cx="512" cy="420" r="22"/><circle cx="530" cy="452" r="18"/><circle cx="506" cy="460" r="16"/>
    <circle cx="368" cy="420" r="20"/><circle cx="352" cy="452" r="16"/>
  </g>
  <!-- Bağışıklık hücreleri -->
  <g fill="#F2F5FA" stroke="#C99A34" stroke-width="3">
    <circle cx="330" cy="370" r="9"/><circle cx="560" cy="370" r="9"/><circle cx="356" cy="520" r="8"/><circle cx="540" cy="530" r="8"/>
  </g>

  <!-- Sağ: açık ve sağlıklı kıl kökü -->
  <path d="M752 300 C 752 360 744 440 738 500 C 734 530 748 548 762 548 C 776 548 790 530 786 500 C 780 440 772 360 772 300 Z" fill="#E4EAF3" stroke="#9FB0CC" stroke-width="3"/>
  <ellipse cx="762" cy="530" rx="14" ry="12" fill="#9FB0CC"/>
  <path d="M762 530 C 762 460 762 380 764 310 C 766 270 780 230 800 200" fill="none" stroke="#5B7299" stroke-width="5" stroke-linecap="round"/>
  <g fill="#E8C56A" opacity="0.75"><circle cx="785" cy="400" r="12"/><circle cx="791" cy="421" r="10"/></g>
  <!-- Açık gözenek -->
  <path d="M742 300 C 750 310 774 310 782 300" fill="none" stroke="#9FB0CC" stroke-width="3" stroke-linecap="round"/>

  <!-- Ayırıcı -->
  <line x1="620" y1="340" x2="620" y2="590" stroke="#9DB4D6" stroke-width="2" stroke-dasharray="4 10" stroke-linecap="round" opacity="0.5"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
