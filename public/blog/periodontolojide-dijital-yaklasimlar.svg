<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Üst ön dişlerin üzerine oturan, dişeti kenarını altın çizgiyle işaretleyen şeffaf cerrahi rehberi ve altında kemik tepesi çizgisini gösteren şematik çizim">
