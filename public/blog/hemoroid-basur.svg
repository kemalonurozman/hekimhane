<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Halka biçimli kanal çevresinde üç yumuşak yastıkçık, yanında lif yaprağı ve su damlası içeren soyut şema">
  <defs>
    <linearGradient id="hmr_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="hmr_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="hmr_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="hmr_cush" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D2E4"/></radialGradient>
    <radialGradient id="hmr_wall" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#9FB0CC"/><stop offset="1" stop-color="#6F86AC"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hmr_bg)"/>
  <rect width="1200" height="675" fill="url(#hmr_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Dış halkalar -->
  <g fill="none" stroke="url(#hmr_gold)" stroke-linecap="round">
    <circle cx="560" cy="350" r="232" stroke-width="2.5" stroke-dasharray="3 12" opacity="0.45"/>
    <circle cx="560" cy="350" r="272" stroke-width="2" stroke-dasharray="2 14" opacity="0.25"/>
  </g>

  <!-- Kanal duvarı -->
  <circle cx="560" cy="350" r="196" fill="url(#hmr_wall)" opacity="0.55"/>
  <circle cx="560" cy="350" r="196" fill="none" stroke="#C7D2E4" stroke-width="10" opacity="0.8"/>
  <circle cx="560" cy="350" r="160" fill="#DCE4F0" opacity="0.18"/>

  <!-- Üç yastıkçık -->
  <g stroke="#9FB0CC" stroke-width="3">
    <ellipse cx="652" cy="350" rx="74" ry="58" fill="url(#hmr_cush)"/>
    <ellipse cx="514" cy="270" rx="74" ry="58" fill="url(#hmr_cush)" transform="rotate(120 514 270)"/>
    <ellipse cx="514" cy="430" rx="74" ry="58" fill="url(#hmr_cush)" transform="rotate(-120 514 430)"/>
  </g>
  <g fill="#fff" opacity="0.7">
    <ellipse cx="640" cy="330" rx="26" ry="12"/>
    <ellipse cx="500" cy="258" rx="22" ry="10" transform="rotate(30 500 258)"/>
    <ellipse cx="500" cy="414" rx="22" ry="10" transform="rotate(-30 500 414)"/>
  </g>

  <!-- Bant halkası -->
  <ellipse cx="652" cy="350" rx="38" ry="64" fill="none" stroke="url(#hmr_gold)" stroke-width="9"/>

  <!-- Lif yaprağı -->
  <g transform="translate(965 250) rotate(-30)">
    <path d="M0 -70 C 46 -40 46 40 0 70 C -46 40 -46 -40 0 -70 Z" fill="url(#hmr_gold)" opacity="0.92"/>
    <path d="M0 -58 L 0 62" stroke="#FFF7E0" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#FFF7E0" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M0 -26 L 20 -40"/><path d="M0 -26 L -20 -40"/><path d="M0 4 L 22 -10"/><path d="M0 4 L -22 -10"/><path d="M0 34 L 18 22"/><path d="M0 34 L -18 22"/>
    </g>
  </g>

  <!-- Su damlası -->
  <g transform="translate(985 455)">
    <path d="M0 -62 C 22 -30 44 -6 44 20 C 44 46 24 64 0 64 C -24 64 -44 46 -44 20 C -44 -6 -22 -30 0 -62 Z" fill="#DCE4F0"/>
    <path d="M-20 18 C -20 34 -10 44 4 46" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
