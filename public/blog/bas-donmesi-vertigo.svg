<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Baş dönmesi ve vertigo — altın renkli dönme halkalarıyla çevrili stilize iç kulak: üç yarım daire kanalı, salyangoz ve denge siniri">
  <defs>
    <linearGradient id="vrt_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="vrt_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="vrt_glow" cx="0.52" cy="0.52" r="0.65"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.9"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="vrt_tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#vrt_bg)"/>
  <rect width="1200" height="675" fill="url(#vrt_glow)"/>
  <circle cx="1080" cy="570" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="980" cy="110" r="140" fill="#fff" opacity="0.025"/>

  <!-- Dönme halkaları (arka) -->
  <g fill="none" stroke="url(#vrt_gold)" stroke-linecap="round">
    <ellipse cx="640" cy="350" rx="380" ry="120" stroke-width="3" opacity="0.28" stroke-dasharray="4 14" transform="rotate(-12 640 350)"/>
    <ellipse cx="640" cy="350" rx="300" ry="250" stroke-width="2.5" opacity="0.18" stroke-dasharray="2 12"/>
  </g>

  <!-- Denge ve işitme siniri -->
  <g fill="none" stroke="#9DB4D6" stroke-linecap="round" opacity="0.85">
    <path d="M690 410 C 760 450 830 470 930 470" stroke-width="16"/>
    <path d="M560 470 C 640 500 760 500 930 486" stroke-width="12"/>
    <path d="M930 478 C 980 478 1010 482 1050 490" stroke-width="22"/>
  </g>

  <!-- Yarım daire kanalları: dış tüp -->
  <g fill="none" stroke="#C7D2E4" stroke-width="30" stroke-linecap="round">
    <path d="M600 360 C 560 250 600 150 690 150 C 780 150 800 250 730 340"/>
    <path d="M700 400 C 780 420 880 360 870 280 C 860 200 760 200 720 300"/>
    <path d="M610 400 C 600 470 760 480 830 430 C 880 395 820 360 740 380"/>
  </g>
  <!-- iç lümen -->
  <g fill="none" stroke="#F2F5FA" stroke-width="16" stroke-linecap="round">
    <path d="M600 360 C 560 250 600 150 690 150 C 780 150 800 250 730 340"/>
    <path d="M700 400 C 780 420 880 360 870 280 C 860 200 760 200 720 300"/>
    <path d="M610 400 C 600 470 760 480 830 430 C 880 395 820 360 740 380"/>
  </g>
  <!-- Ampuller (uç genişlemeleri) -->
  <g fill="#DCE4F0">
    <ellipse cx="606" cy="350" rx="24" ry="20"/>
    <ellipse cx="724" cy="306" rx="22" ry="20"/>
  </g>

  <!-- Vestibül -->
  <ellipse cx="660" cy="378" rx="74" ry="52" fill="url(#vrt_tube)"/>
  <ellipse cx="660" cy="372" rx="46" ry="28" fill="#DCE4F0"/>

  <!-- Salyangoz (koklea) -->
  <path d="M600 410 C 590 430 580 440 560 444" fill="none" stroke="#C7D2E4" stroke-width="34" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M560 444 A 78 78 0 0 0 404 444 A 64 64 0 0 0 532 444 A 50 50 0 0 0 432 444 A 36 36 0 0 0 504 444 A 22 22 0 0 0 460 444" stroke="#C7D2E4" stroke-width="30"/>
    <path d="M560 444 A 78 78 0 0 0 404 444 A 64 64 0 0 0 532 444 A 50 50 0 0 0 432 444 A 36 36 0 0 0 504 444 A 22 22 0 0 0 460 444" stroke="#F2F5FA" stroke-width="16"/>
  </g>

  <!-- Kopmuş kristaller (otokonya) -->
  <g fill="url(#vrt_gold)" stroke="#FFF3D0" stroke-width="1">
    <rect x="592" y="262" width="18" height="18" rx="2" transform="rotate(25 598 268)"/>
    <rect x="602" y="232" width="13.5" height="13.5" rx="2" transform="rotate(50 606 236)"/>
    <rect x="584" y="292" width="15" height="15" rx="2" transform="rotate(10 589 297)"/>
    <rect x="640" y="356" width="12" height="12" rx="1.5" transform="rotate(30 644 360)"/>
    <rect x="660" y="364" width="15" height="15" rx="2" transform="rotate(60 665 369)"/>
    <rect x="676" y="352" width="10.5" height="10.5" rx="1.5" transform="rotate(15 679 355)"/>
  </g>

  <!-- Dönme halkası (ön) ve oklar -->
  <g fill="none" stroke="url(#vrt_gold)" stroke-width="7" stroke-linecap="round">
    <path d="M330 300 C 300 200 420 110 560 92"/>
    <path d="M960 410 C 990 510 870 590 730 606"/>
  </g>
  <g fill="url(#vrt_gold)">
    <path d="M560 72 L 596 92 L 560 112 Z"/>
    <path d="M730 586 L 694 606 L 730 626 Z"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
