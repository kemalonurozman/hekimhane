<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Kök kanalı görünen diş kesiti üzerinde altın renkli rehber kılıfı ve ince freze ekseni ile kesit görüntü katmanlarını gösteren şematik çizim">
  <defs>
    <linearGradient id="endod_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="endod_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="endod_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="endod_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="endod_glow" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="endod_hot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.5"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#endod_bg)"/>
  <rect width="1200" height="675" fill="url(#endod_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="160" cy="560" r="170" fill="#fff" opacity="0.025"/>

  <g transform="translate(30 10)">
    <!-- Alveol kemiği -->
    <path d="M-60 372 C 120 334 330 322 420 338 L 470 690 L -60 690 Z" fill="#9DB4D6" opacity="0.09"/>
    <path d="M1300 372 C 900 330 630 322 540 338 L 490 690 L 1300 690 Z" fill="#9DB4D6" opacity="0.09"/>
    <path d="M-60 372 C 120 334 330 322 420 338" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.35"/>
    <path d="M1300 372 C 900 330 630 322 540 338" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.35"/>
    <circle cx="480" cy="612" r="46" fill="url(#endod_hot)"/>
    <!-- Diş -->
    <path d="M400 250 C 395 190 420 152 480 150 C 540 152 565 190 560 250 C 556 330 530 420 512 520 C 504 565 494 598 480 604 C 466 598 456 565 448 520 C 430 420 404 330 400 250 Z" fill="url(#endod_skin)"/>
    <path d="M425 225 C 440 205 520 205 535 225" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.6"/>
    <!-- Kalsifiye üst kanal (kesik) + görünen alt kanal -->
    <path d="M480 250 L 480 380" stroke="#16325C" stroke-width="5" stroke-dasharray="4 9" stroke-linecap="round" opacity="0.55"/>
    <path d="M475 380 C 474 450 476 520 478 588 L 482 588 C 484 520 486 450 485 380 Z" fill="#16325C"/>
    <!-- Rehber -->
    <path d="M345 182 L 345 132 Q 345 110 367 110 L 593 110 Q 615 110 615 132 L 615 182 Q 560 160 480 158 Q 400 160 345 182 Z" fill="#EEF2F8" opacity="0.16" stroke="#9DB4D6" stroke-width="2.5"/>
    <rect x="378" y="124" width="34" height="20" rx="6" fill="#12294B" opacity="0.7"/>
    <rect x="548" y="124" width="34" height="20" rx="6" fill="#12294B" opacity="0.7"/>
    <rect x="461" y="54" width="38" height="82" rx="7" fill="url(#endod_gold)"/>
    <rect x="472" y="54" width="16" height="82" rx="4" fill="#12294B" opacity="0.55"/>
    <!-- Freze ekseni -->
    <line x1="480" y1="30" x2="480" y2="384" stroke="url(#endod_gold)" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round"/>
    <circle cx="480" cy="384" r="9" fill="url(#endod_gold)"/>
    <circle cx="480" cy="384" r="20" fill="none" stroke="#E8C56A" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- KIBT kesit katmanları -->
  <g transform="translate(760 168)">
    <rect x="60" y="-56" width="300" height="230" rx="20" fill="#EEF2F8" opacity="0.06"/>
    <rect x="30" y="-28" width="300" height="230" rx="20" fill="#EEF2F8" opacity="0.10"/>
    <rect x="0" y="0" width="300" height="230" rx="20" fill="#EEF2F8" opacity="0.14"/>
    <rect x="12" y="12" width="276" height="206" rx="13" fill="url(#endod_screen)"/>
    <g stroke="#9DB4D6" stroke-width="1.2" opacity="0.2">
      <line x1="12" y1="63" x2="288" y2="63"/><line x1="12" y1="115" x2="288" y2="115"/><line x1="12" y1="167" x2="288" y2="167"/>
      <line x1="81" y1="12" x2="81" y2="218"/><line x1="150" y1="12" x2="150" y2="218"/><line x1="219" y1="12" x2="219" y2="218"/>
    </g>
    <ellipse cx="150" cy="115" rx="62" ry="54" fill="url(#endod_skin)" opacity="0.92"/>
    <ellipse cx="150" cy="115" rx="40" ry="34" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.7"/>
    <circle cx="150" cy="115" r="7" fill="#16325C"/>
    <line x1="150" y1="40" x2="150" y2="190" stroke="#E8C56A" stroke-width="2" opacity="0.8"/>
    <line x1="74" y1="115" x2="226" y2="115" stroke="#E8C56A" stroke-width="2" opacity="0.8"/>
    <circle cx="150" cy="115" r="16" fill="none" stroke="#E8C56A" stroke-width="2.5"/>
  </g>
  <g transform="translate(760 440)" fill="#9DB4D6">
    <rect x="0" y="0" width="190" height="12" rx="6" opacity="0.35"/>
    <rect x="0" y="26" width="130" height="12" rx="6" opacity="0.22"/>
    <rect x="0" y="52" width="160" height="12" rx="6" opacity="0.18"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">DİJİTAL HEKİMLİK</text>
  </g>
</svg>
