<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Cilt lekeleri — yanağında açık kahve lekeler bulunan stilize yüz profili, altın renkli güneş ve ışınları tutan koruyucu kalkan">
  <defs>
    <linearGradient id="lek_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="lek_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="lek_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="lek_sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.35"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
    <linearGradient id="lek_skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7D2E4"/><stop offset="1" stop-color="#F2F5FA"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#lek_bg)"/>
  <rect width="1200" height="675" fill="url(#lek_glow)"/>
  <circle cx="160" cy="580" r="200" fill="#fff" opacity="0.03"/>

  <!-- Güneş -->
  <circle cx="1020" cy="150" r="150" fill="url(#lek_sunglow)"/>
  <circle cx="1020" cy="150" r="58" fill="url(#lek_gold)"/>
  <g stroke="#E2B856" stroke-width="8" stroke-linecap="round">
    <line x1="1020" y1="62" x2="1020" y2="36"/><line x1="1108" y1="150" x2="1134" y2="150"/><line x1="932" y1="150" x2="906" y2="150"/>
    <line x1="1082" y1="88" x2="1100" y2="70"/><line x1="958" y1="88" x2="940" y2="70"/><line x1="1082" y1="212" x2="1100" y2="230"/><line x1="958" y1="212" x2="940" y2="230"/>
  </g>
  <!-- Işınlar kalkana çarpıyor -->
  <g stroke="#E8C56A" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M960 206 L 900 262"/><path d="M990 222 L 930 300"/><path d="M1012 232 L 960 330"/>
  </g>

  <!-- Yüz profili -->
  <path d="M400 675 C 400 600 390 560 370 520 C 330 450 316 380 328 318 C 344 212 430 150 530 150 C 620 150 682 204 694 272 C 698 300 698 318 704 334 C 714 356 730 378 746 400 C 752 409 750 418 738 422 L 728 426 C 734 436 736 444 731 450 C 737 456 738 464 730 470 C 734 480 730 492 720 498 C 726 516 718 534 698 542 C 668 552 640 552 620 556 C 610 590 610 630 616 675 Z" fill="url(#lek_skin)"/>
  <!-- Saç -->
  <path d="M330 330 C 330 220 420 150 530 150 C 610 150 668 190 688 246 C 640 214 590 206 540 214 C 500 222 470 250 452 290 C 436 330 410 352 384 352 C 360 352 340 346 330 330 Z" fill="#9FB0CC"/>
  <!-- Kulak -->
  <path d="M452 340 C 432 330 418 348 422 372 C 426 396 440 412 458 410 C 470 408 474 392 470 376 C 466 360 462 346 452 340 Z" fill="#DCE4F0" stroke="#B6C3DA" stroke-width="3"/>
  <!-- Kaş ve göz -->
  <path d="M640 292 C 660 284 678 286 690 294" fill="none" stroke="#8496B6" stroke-width="5" stroke-linecap="round"/>
  <path d="M652 322 C 662 316 674 316 682 322" fill="none" stroke="#5B7299" stroke-width="4" stroke-linecap="round"/>
  <!-- Yanaktaki lekeler -->
  <g fill="#B08A4E" opacity="0.55">
    <path d="M590 376 C 604 366 626 368 636 380 C 644 392 632 404 616 404 C 600 404 580 392 590 376 Z"/>
    <ellipse cx="654" cy="408" rx="10" ry="7"/>
    <ellipse cx="600" cy="420" rx="8" ry="6"/>
    <ellipse cx="636" cy="432" rx="6" ry="4.5"/>
  </g>

  <!-- Koruyucu kalkan -->
  <g transform="translate(860 330)">
    <path d="M0 -92 C 30 -74 58 -68 84 -68 C 84 -6 66 56 0 92 C -66 56 -84 -6 -84 -68 C -58 -68 -30 -74 0 -92 Z" fill="#F7F9FC" opacity="0.18"/>
    <path d="M0 -92 C 30 -74 58 -68 84 -68 C 84 -6 66 56 0 92 C -66 56 -84 -6 -84 -68 C -58 -68 -30 -74 0 -92 Z" fill="none" stroke="url(#lek_gold)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M-30 2 L -8 26 L 34 -22" fill="none" stroke="#F2F5FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
