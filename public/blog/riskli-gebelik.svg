<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Riskli gebelik — koruyucu halkanın içinde kıvrılmış bebek silueti ve altın renkli kalp atışı çizgisi">
  <defs>
    <linearGradient id="rgb_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="rgb_gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="rgb_glow" cx="0.5" cy="0.45" r="0.65"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.9"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="rgb_womb" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#2F5A93"/><stop offset="1" stop-color="#1D3D6C"/></radialGradient>
    <linearGradient id="rgb_baby" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#rgb_bg)"/>
  <rect width="1200" height="675" fill="url(#rgb_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="140" fill="#fff" opacity="0.025"/>

  <!-- Kalp atışı çizgisi (arka) -->
  <path d="M90 470 L 180 470 L 202 440 L 226 506 L 252 380 L 278 540 L 302 470 L 900 470 L 922 440 L 946 506 L 972 380 L 998 540 L 1022 470 L 1110 470" fill="none" stroke="url(#rgb_gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>

  <!-- Koruyucu halka -->
  <circle cx="600" cy="320" r="205" fill="url(#rgb_womb)"/>
  <circle cx="600" cy="320" r="205" fill="none" stroke="url(#rgb_gold)" stroke-width="9"/>
  <circle cx="600" cy="320" r="232" fill="none" stroke="#9DB4D6" stroke-width="2" opacity="0.35" stroke-dasharray="3 12" stroke-linecap="round"/>

  <!-- Kıvrılmış bebek silueti -->
  <g fill="url(#rgb_baby)">
    <!-- gövde: sırt sağda, kıvrık -->
    <path d="M598 222 C 680 222 730 290 722 370 C 714 440 650 470 590 452 C 546 438 528 400 548 372 C 566 348 604 356 624 330 C 640 308 626 282 596 280 Z"/>
    <!-- baş -->
    <circle cx="560" cy="250" r="66"/>
    <!-- kol: dirsekten bükülmüş, el çeneye yakın -->
    <path d="M610 300 C 588 312 566 316 548 306" fill="none" stroke="#DCE4F0" stroke-width="22" stroke-linecap="round"/>
    <!-- bacak: diz göğse çekili -->
    <path d="M650 430 C 600 432 560 420 540 392" fill="none" stroke="#DCE4F0" stroke-width="30" stroke-linecap="round"/>
    <ellipse cx="530" cy="384" rx="24" ry="15" transform="rotate(40 530 384)" fill="#DCE4F0"/>
  </g>
  <!-- göbek kordonu -->
  <path d="M600 376 C 640 398 680 392 700 420 C 716 444 730 456 744 470" fill="none" stroke="#E8C56A" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- ışık -->
  <path d="M520 214 A 50 50 0 0 1 560 196" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- Küçük kalp -->
  <path d="M846 170 c -14 -20 -46 -12 -46 12 c 0 22 30 38 46 52 c 16 -14 46 -30 46 -52 c 0 -24 -32 -32 -46 -12 z" fill="url(#rgb_gold)"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
