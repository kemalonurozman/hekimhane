<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Geriatrik rehabilitasyon — bastonla yürüyen ileri yaşta bir kişi, yanında sandalye ve yerde altın renkli güvenli yürüyüş yolu">
  <defs>
    <linearGradient id="ger_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="ger_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="ger_goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C99A34" stop-opacity="0"/><stop offset="0.25" stop-color="#E8C56A"/><stop offset="0.75" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34" stop-opacity="0"/></linearGradient>
    <radialGradient id="ger_glow" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ger_bg)"/>
  <rect width="1200" height="675" fill="url(#ger_glow)"/>
  <circle cx="1060" cy="130" r="210" fill="#fff" opacity="0.035"/>
  <circle cx="140" cy="590" r="180" fill="#fff" opacity="0.03"/>

  <!-- Zemin ve yürüyüş yolu -->
  <rect x="250" y="544" width="700" height="6" rx="3" fill="url(#ger_goldh)"/>
  <g fill="url(#ger_gold)" opacity="0.8">
    <ellipse cx="760" cy="572" rx="14" ry="6"/><ellipse cx="820" cy="590" rx="14" ry="6"/><ellipse cx="880" cy="572" rx="14" ry="6"/><ellipse cx="940" cy="590" rx="14" ry="6" opacity="0.6"/><ellipse cx="1000" cy="572" rx="14" ry="6" opacity="0.35"/>
  </g>

  <!-- Sandalye (otur-kalk) -->
  <g fill="none" stroke="#9FB0CC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 300 L 392 446 L 392 540"/>
    <path d="M384 446 L 488 446 L 488 540"/>
  </g>
  <rect x="380" y="436" width="116" height="16" rx="8" fill="#C7D2E4"/>

  <!-- Arkadaki bacak ve kol -->
  <g fill="none" stroke="#B9C6DA" stroke-linecap="round" stroke-linejoin="round">
    <path d="M604 392 L 590 462 L 556 526" stroke-width="40"/>
    <path d="M558 528 L 588 540" stroke-width="22"/>
    <path d="M620 284 L 598 344 L 588 392" stroke-width="28"/>
  </g>

  <!-- Gövde, baş, öndeki bacak -->
  <g fill="none" stroke="#EEF2F8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M630 276 L 602 386" stroke-width="62"/>
    <path d="M606 392 L 638 462 L 650 532" stroke-width="40"/>
    <path d="M652 536 L 690 540" stroke-width="22"/>
  </g>
  <circle cx="668" cy="196" r="35" fill="#EEF2F8"/>

  <!-- Baston -->
  <g fill="none" stroke="url(#ger_gold)" stroke-width="12" stroke-linecap="round">
    <path d="M716 540 L 700 384 C 698 364 724 358 730 376"/>
  </g>

  <!-- Öndeki kol (bastonu tutan) -->
  <g fill="none" stroke="#EEF2F8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M634 286 L 648 344 L 698 374" stroke-width="28"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
