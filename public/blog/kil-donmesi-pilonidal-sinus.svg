<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Kuyruk sokumu kemiği şeması üzerinde orta hattaki küçük delikler, ince kıllar ve kesikli altın eşkenar dörtgen flep çizgisi">
  <defs>
    <linearGradient id="pls_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="pls_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="pls_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="pls_bone" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="480"><stop offset="0" stop-color="#DCE4F0"/><stop offset="1" stop-color="#AFC0DA"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pls_bg)"/>
  <rect width="1200" height="675" fill="url(#pls_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Sakrum -->
  <path d="M452 108 C 520 96 680 96 748 108 C 742 170 712 250 668 318 C 648 348 626 372 600 384 C 574 372 552 348 532 318 C 488 250 458 170 452 108 Z" fill="url(#pls_bone)" opacity="0.92"/>
  <g fill="#7F95BA" opacity="0.75">
    <ellipse cx="550" cy="150" rx="13" ry="10"/><ellipse cx="650" cy="150" rx="13" ry="10"/>
    <ellipse cx="560" cy="208" rx="11" ry="9"/><ellipse cx="640" cy="208" rx="11" ry="9"/>
    <ellipse cx="571" cy="262" rx="9" ry="7.5"/><ellipse cx="629" cy="262" rx="9" ry="7.5"/>
    <ellipse cx="583" cy="310" rx="7" ry="6"/><ellipse cx="617" cy="310" rx="7" ry="6"/>
  </g>
  <g fill="none" stroke="#9FB0CC" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M520 180 C 560 186 640 186 680 180"/><path d="M536 236 C 570 241 630 241 664 236"/><path d="M552 288 C 580 292 620 292 648 288"/>
  </g>
  <!-- Kuyruk sokumu -->
  <g fill="url(#pls_bone)">
    <rect x="578" y="392" width="44" height="26" rx="12"/>
    <rect x="583" y="424" width="34" height="22" rx="10"/>
    <rect x="588" y="452" width="24" height="18" rx="9"/>
  </g>

  <!-- Orta hat -->
  <path d="M600 360 L 600 640" stroke="#C7D2E4" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.35"/>

  <!-- Flep çizgisi (eşkenar dörtgen) -->
  <path d="M600 392 L 696 516 L 600 640 L 504 516 Z" fill="#E8C56A" fill-opacity="0.06" stroke="url(#pls_gold)" stroke-width="4" stroke-dasharray="10 10" stroke-linejoin="round"/>

  <!-- Delikler -->
  <g fill="#12294B" stroke="#E8C56A" stroke-width="3">
    <circle cx="600" cy="502" r="8"/><circle cx="600" cy="536" r="7"/><circle cx="600" cy="568" r="6"/>
  </g>
  <!-- Kıllar -->
  <g fill="none" stroke="#F2F5FA" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M 600 502 C 614 486 628 480 646 476"/>
    <path d="M 600 502 C 588 484 572 476 556 474"/>
    <path d="M 600 536 C 618 528 636 528 652 532"/>
    <path d="M 600 536 C 584 524 566 522 548 526"/>
    <path d="M 600 568 C 612 578 628 584 644 586"/>
  </g>

  <!-- Dekoratif halkalar -->
  <g fill="none" stroke="url(#pls_gold)" stroke-linecap="round" opacity="0.35">
    <circle cx="600" cy="516" r="168" stroke-width="2.5" stroke-dasharray="3 12"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
