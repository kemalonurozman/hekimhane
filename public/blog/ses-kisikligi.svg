<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Endoskop görüntüsü gibi yuvarlak çerçevede yukarıdan görülen iki ses teli ve kesik altın ses dalgaları">
  <defs>
    <linearGradient id="ses_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="ses_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="ses_mucosa" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#C7D2E4"/><stop offset="1" stop-color="#7F9BC4"/></radialGradient>
    <linearGradient id="ses_fold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
    <linearGradient id="ses_dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0B1C36"/></linearGradient>
    <radialGradient id="ses_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <clipPath id="ses_clip"><circle cx="600" cy="340" r="222"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#ses_bg)"/>
  <rect width="1200" height="675" fill="url(#ses_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Ses dalgaları: solda düzgün, sağda kesik -->
  <g fill="none" stroke-linecap="round">
    <path d="M160 340 C 185 300 205 300 230 340 C 255 380 275 380 300 340 C 320 308 336 308 352 330" stroke="#9DB4D6" stroke-width="5" opacity="0.55"/>
    <path d="M848 330 C 864 308 880 308 900 340" stroke="url(#ses_gold)" stroke-width="6"/>
    <path d="M916 362 C 928 378 940 376 950 360" stroke="url(#ses_gold)" stroke-width="6" opacity="0.85"/>
    <path d="M972 330 C 980 318 988 318 996 330" stroke="url(#ses_gold)" stroke-width="6" opacity="0.65"/>
    <path d="M1016 348 C 1022 356 1028 356 1032 348" stroke="url(#ses_gold)" stroke-width="6" opacity="0.45"/>
    <circle cx="1056" cy="340" r="4" fill="#E8C56A" opacity="0.35"/>
  </g>

  <!-- Endoskop görüntüsü -->
  <circle cx="600" cy="340" r="236" fill="#0E2240"/>
  <g clip-path="url(#ses_clip)">
    <rect x="370" y="110" width="460" height="460" fill="url(#ses_mucosa)"/>
    <!-- Epiglot -->
    <path d="M462 236 C 470 150 730 150 738 236 C 700 196 500 196 462 236 Z" fill="#E4EAF3"/>
    <path d="M462 236 C 500 196 700 196 738 236" fill="none" stroke="#9FB0CC" stroke-width="4" opacity="0.6"/>
    <!-- Yalancı ses telleri -->
    <path d="M592 250 C 560 300 520 380 500 452 C 520 462 534 462 546 450 C 560 380 582 310 600 262 Z" fill="#9FB0CC"/>
    <path d="M608 250 C 640 300 680 380 700 452 C 680 462 666 462 654 450 C 640 380 618 310 600 262 Z" fill="#9FB0CC"/>
    <!-- Glottis açıklığı -->
    <path d="M600 258 L 572 440 C 586 452 614 452 628 440 Z" fill="url(#ses_dark)"/>
    <g fill="none" stroke="#2A4E82" stroke-width="4" opacity="0.8">
      <path d="M588 396 C 596 400 604 400 612 396"/>
      <path d="M582 420 C 594 426 606 426 618 420"/>
    </g>
    <!-- Ses telleri -->
    <path d="M598 254 C 588 300 568 380 552 446 C 560 454 572 454 580 446 C 586 380 596 304 600 260 Z" fill="url(#ses_fold)"/>
    <path d="M602 254 C 612 300 632 380 648 446 C 640 454 628 454 620 446 C 614 380 604 304 600 260 Z" fill="url(#ses_fold)"/>
    <circle cx="590" cy="326" r="7" fill="url(#ses_gold)"/>
    <circle cx="610" cy="326" r="7" fill="url(#ses_gold)"/>
    <!-- Aritenoidler -->
    <ellipse cx="552" cy="470" rx="34" ry="26" fill="#C7D2E4"/>
    <ellipse cx="648" cy="470" rx="34" ry="26" fill="#C7D2E4"/>
    <path d="M520 520 C 560 500 640 500 680 520" fill="none" stroke="#9FB0CC" stroke-width="4" opacity="0.6"/>
  </g>
  <circle cx="600" cy="340" r="229" fill="none" stroke="url(#ses_gold)" stroke-width="12"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
