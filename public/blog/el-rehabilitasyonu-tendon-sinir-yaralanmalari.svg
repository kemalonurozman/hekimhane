<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="El rehabilitasyonu — bilekte atel bulunan açık el, parmaklar boyunca altın tendon çizgileri ve dallanan ince sinir hattı">
  <defs>
    <linearGradient id="elr_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="elr_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="elr_splint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9FB0CC"/><stop offset="0.5" stop-color="#C7D2E4"/><stop offset="1" stop-color="#9FB0CC"/></linearGradient>
    <radialGradient id="elr_glow" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#elr_bg)"/>
  <rect width="1200" height="675" fill="url(#elr_glow)"/>
  <circle cx="1060" cy="130" r="220" fill="#fff" opacity="0.035"/>
  <circle cx="150" cy="570" r="180" fill="#fff" opacity="0.03"/>

  <!-- Hareket yayı (kontrollü erken hareket) -->
  <g fill="none" stroke="url(#elr_gold)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M760 150 A 150 150 0 0 1 820 330" stroke-dasharray="2 16"/>
    <path d="M808 312 L 821 334 L 838 314" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="url(#elr_gold)" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M440 150 A 150 150 0 0 0 380 330" stroke-dasharray="2 16"/>
    <path d="M362 314 L 379 334 L 392 312" stroke-linejoin="round"/>
  </g>

  <g transform="translate(600 380)">
    <!-- Ön kol -->
    <path d="M-74 90 L -66 320 L 66 320 L 74 90 Z" fill="#E3E9F2"/>
    <!-- El: avuç + parmaklar + başparmak (sağ el, avuç içi görünüyor) -->
    <g fill="#EEF2F8">
      <path d="M-100 -50 C -104 20 -92 80 -70 110 L 70 110 C 92 80 104 20 98 -50 Z"/>
      <rect x="-104" y="-232" width="44" height="210" rx="22"/>
      <rect x="-52" y="-262" width="46" height="240" rx="23"/>
      <rect x="2" y="-246" width="45" height="224" rx="22.5"/>
      <rect x="54" y="-196" width="40" height="176" rx="20"/>
      <rect x="-24" y="-156" width="48" height="190" rx="24" transform="translate(-74 52) rotate(-40)"/>
    </g>
    <!-- Boğum çizgileri -->
    <g stroke="#C9D4E5" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-96 -160 h 28"/><path d="M-96 -96 h 28"/>
      <path d="M-43 -190 h 28"/><path d="M-43 -114 h 28"/>
      <path d="M11 -176 h 28"/><path d="M11 -106 h 28"/>
      <path d="M62 -136 h 24"/><path d="M62 -80 h 24"/>
      <path d="M-92 -26 C -40 -8 30 -12 90 -40" opacity="0.7"/>
    </g>
    <!-- Bükücü tendonlar -->
    <g fill="none" stroke="url(#elr_gold)" stroke-width="6" stroke-linecap="round">
      <path d="M-14 112 C -30 40 -82 0 -82 -70 L -82 -200"/>
      <path d="M-4 112 C -10 40 -29 0 -29 -70 L -29 -230"/>
      <path d="M6 112 C 10 40 25 0 25 -70 L 25 -214"/>
      <path d="M16 112 C 30 40 74 10 74 -60 L 74 -166"/>
      <path d="M-20 114 C -44 92 -70 72 -84 42 L -160 -48"/>
    </g>
    <!-- Median sinir ve dalları -->
    <g fill="none" stroke="#8FB6E8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9">
      <path d="M-2 300 L -2 120 C -2 70 -66 30 -68 -20 L -68 -196"/>
      <path d="M-2 120 C -4 70 -14 30 -14 -20 L -14 -226"/>
      <path d="M-2 120 C 2 70 10 30 10 -20 L 10 -206"/>
      <path d="M-2 120 C -30 100 -56 80 -66 56 L -132 -24"/>
    </g>
    <g fill="#8FB6E8"><circle cx="-68" cy="-196" r="5.5"/><circle cx="-14" cy="-226" r="5.5"/><circle cx="10" cy="-206" r="5.5"/><circle cx="-132" cy="-24" r="5.5"/></g>
    <!-- Atel ve kayışlar -->
    <path d="M-80 140 L -76 300 L 76 300 L 80 140 C 40 128 -40 128 -80 140 Z" fill="url(#elr_splint)" opacity="0.95"/>
    <g fill="#5F7BA6"><rect x="-82" y="168" width="164" height="18" rx="6"/><rect x="-80" y="246" width="160" height="18" rx="6"/></g>
    <g fill="url(#elr_gold)"><rect x="40" y="166" width="26" height="22" rx="5"/><rect x="38" y="244" width="26" height="22" rx="5"/></g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
