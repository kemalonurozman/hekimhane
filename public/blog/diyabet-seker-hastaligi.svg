<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diyabet — ekranında dalgalı şeker eğrisi bulunan ölçüm cihazı, sürekli glukoz sensörü ve altın renkli glukoz molekülü halkaları">
  <defs>
    <linearGradient id="dia_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="dia_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="dia_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="dia_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="dia_glow" cx="0.55" cy="0.48" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dia_bg)"/>
  <rect width="1200" height="675" fill="url(#dia_glow)"/>
  <circle cx="1070" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Sinyal yayları -->
  <g fill="none" stroke="url(#dia_gold)" stroke-width="4" stroke-linecap="round">
    <path d="M748 268 A 80 80 0 0 0 748 372" opacity="0.9"/>
    <path d="M716 238 A 120 120 0 0 0 716 402" opacity="0.6"/>
    <path d="M684 208 A 160 160 0 0 0 684 432" opacity="0.35"/>
  </g>

  <!-- Test şeridi -->
  <rect x="476" y="78" width="48" height="96" rx="7" fill="#F2F5FA"/>
  <rect x="476" y="78" width="48" height="24" rx="7" fill="url(#dia_gold)"/>
  <g stroke="#9FB0CC" stroke-width="2.4"><line x1="490" y1="118" x2="490" y2="160"/><line x1="500" y1="118" x2="500" y2="160"/><line x1="510" y1="118" x2="510" y2="160"/></g>

  <!-- Ölçüm cihazı -->
  <rect x="360" y="150" width="280" height="410" rx="52" fill="url(#dia_skin)"/>
  <rect x="360" y="150" width="280" height="410" rx="52" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <rect x="390" y="196" width="220" height="176" rx="20" fill="url(#dia_screen)"/>
  <rect x="404" y="252" width="192" height="62" fill="#9DB4D6" opacity="0.16"/>
  <g stroke="#9DB4D6" stroke-width="1.2" opacity="0.25"><line x1="404" y1="252" x2="596" y2="252"/><line x1="404" y1="314" x2="596" y2="314"/></g>
  <path d="M410 300 C 432 296 446 236 474 244 C 500 252 506 330 534 318 C 556 308 566 262 594 268" fill="none" stroke="url(#dia_gold)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="594" cy="268" r="9" fill="#FFF7E0"/>
  <circle cx="500" cy="458" r="42" fill="#C7D2E4"/>
  <circle cx="500" cy="458" r="30" fill="#F2F5FA"/>
  <rect x="398" y="446" width="44" height="24" rx="12" fill="#C7D2E4"/>
  <rect x="558" y="446" width="44" height="24" rx="12" fill="#C7D2E4"/>

  <!-- Sürekli glukoz sensörü -->
  <circle cx="860" cy="320" r="92" fill="#9FB0CC" opacity="0.35"/>
  <circle cx="860" cy="320" r="80" fill="#C7D2E4"/>
  <circle cx="860" cy="320" r="64" fill="#F2F5FA"/>
  <circle cx="860" cy="320" r="30" fill="url(#dia_gold)"/>
  <circle cx="860" cy="320" r="11" fill="#FFF7E0"/>

  <!-- Glukoz molekülü (altıgen halkalar) -->
  <g fill="none" stroke="url(#dia_gold)" stroke-width="6" stroke-linejoin="round">
    <path d="M880 496 L 914 476 L 948 496 L 948 536 L 914 556 L 880 536 Z"/>
    <path d="M982 476 L 1016 456 L 1050 476 L 1050 516 L 1016 536 L 982 516 Z"/>
    <line x1="948" y1="496" x2="982" y2="476"/>
  </g>
  <g fill="#F2F5FA"><circle cx="914" cy="476" r="7"/><circle cx="880" cy="536" r="7"/><circle cx="1050" cy="516" r="7"/><circle cx="1016" cy="456" r="7"/></g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
