<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Böbrek hastalıkları — iki böbrek, idrar kanalları ve mesane şeması; bir idrar kanalında altın renkli küçük taş, yanda süzme birimi ve damlalar">
  <defs>
    <linearGradient id="bob_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="bob_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="bob_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="bob_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="bob_glow" cx="0.55" cy="0.48" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <path id="bob_kp" d="M470 150 C 534 150 562 204 556 252 C 552 280 530 288 530 304 C 530 320 552 328 556 356 C 562 404 534 458 470 458 C 400 458 372 392 372 304 C 372 216 400 150 470 150 Z"/>
  </defs>
  <rect width="1200" height="675" fill="url(#bob_bg)"/>
  <rect width="1200" height="675" fill="url(#bob_glow)"/>
  <circle cx="1070" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <g transform="translate(-60 0)">
    <!-- Sol böbrek -->
    <g id="bob_k">
      <use href="#bob_kp" fill="url(#bob_skin)"/>
      <use href="#bob_kp" transform="translate(470 304) scale(0.84) translate(-470 -304)" fill="#DCE4F0"/>
      <g fill="#C7D2E4">
        <path d="M418 206 C 432 196 450 190 464 190 L 476 252 Z"/>
        <path d="M398 280 C 396 296 396 312 398 328 L 462 304 Z"/>
        <path d="M418 402 C 432 412 450 418 464 418 L 476 356 Z"/>
      </g>
      <path d="M466 236 C 488 258 500 280 504 296 L 556 296 L 556 312 L 504 312 C 500 328 488 350 466 372 C 480 344 484 324 484 304 C 484 284 480 264 466 236 Z" fill="#9FB0CC"/>
    </g>
    <use href="#bob_k" transform="translate(1200 0) scale(-1 1)"/>

    <!-- İdrar kanalları -->
    <g fill="none" stroke="#C7D2E4" stroke-width="12" stroke-linecap="round">
      <path d="M552 304 C 574 360 562 430 576 520"/>
      <path d="M648 304 C 626 360 638 430 624 520"/>
    </g>

    <!-- Mesane -->
    <path d="M600 504 C 662 504 678 540 672 576 C 666 614 636 630 600 630 C 564 630 534 614 528 576 C 522 540 538 504 600 504 Z" fill="url(#bob_skin)"/>
    <path d="M590 628 L 610 628 L 607 662 L 593 662 Z" fill="#C7D2E4"/>

    <!-- Taş -->
    <path d="M558 402 L 570 394 L 582 400 L 584 414 L 574 424 L 560 420 Z" fill="url(#bob_gold)"/>
    <circle cx="570" cy="409" r="25" fill="none" stroke="#E8C56A" stroke-width="2.5" stroke-dasharray="3 7" opacity="0.85"/>
  </g>

  <!-- Süzme birimi (glomerül) ve damlalar -->
  <g transform="translate(930 290)">
    <path d="M-30 -150 C -30 -110 -20 -80 -12 -40" fill="none" stroke="url(#bob_gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M30 -150 C 30 -110 20 -80 12 -40" fill="none" stroke="#9DB4D6" stroke-width="7" stroke-linecap="round"/>
    <circle r="66" fill="#fff" opacity="0.06"/>
    <circle r="66" fill="none" stroke="#C7D2E4" stroke-width="5"/>
    <g fill="none" stroke="url(#bob_gold)" stroke-width="5">
      <circle cx="-14" cy="-6" r="18"/><circle cx="14" cy="-6" r="18"/><circle cx="-10" cy="20" r="16"/><circle cx="12" cy="20" r="16"/><circle cx="0" cy="-26" r="14"/>
    </g>
    <path d="M0 66 L 0 96" stroke="#C7D2E4" stroke-width="5" stroke-linecap="round"/>
    <g fill="#9DB4D6">
      <path d="M0 120 C 11 136 16 145 16 154 A 16 16 0 0 1 -16 154 C -16 145 -11 136 0 120 Z"/>
      <path d="M0 190 C 8 202 12 208 12 215 A 12 12 0 0 1 -12 215 C -12 208 -8 202 0 190 Z" opacity="0.7"/>
      <path d="M0 246 C 6 255 9 260 9 265 A 9 9 0 0 1 -9 265 C -9 260 -6 255 0 246 Z" opacity="0.5"/>
    </g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
