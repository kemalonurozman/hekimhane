<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Çocuklarda ilk diş hekimi ziyareti — güler yüzlü diş ve diş hekimi aynası simgesi">
  <defs>
    <linearGradient id="d_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="d_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="d_glow" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#d_bg)"/>
  <rect width="1200" height="675" fill="url(#d_glow)"/>
  <circle cx="1040" cy="120" r="210" fill="#fff" opacity="0.035"/>
  <circle cx="150" cy="580" r="180" fill="#fff" opacity="0.03"/>
  <g fill="url(#d_gold)" opacity="0.5"><circle cx="250" cy="150" r="7"/><circle cx="960" cy="520" r="8"/><circle cx="880" cy="150" r="5"/></g>

  <!-- Friendly tooth -->
  <g transform="translate(560 350) scale(1.7)">
    <path d="M0 -72 C -46 -72 -84 -44 -84 2 C -84 40 -72 70 -58 92 C -49 106 -35 108 -29 92 C -22 74 -14 66 0 66 C 14 66 22 74 29 92 C 35 108 49 106 58 92 C 72 70 84 40 84 2 C 84 -44 46 -72 0 -72 Z" fill="#FFFFFF"/>
    <g fill="#1B3A69"><circle cx="-28" cy="-6" r="7"/><circle cx="28" cy="-6" r="7"/></g>
    <path d="M-26 22 C -12 40 12 40 26 22" fill="none" stroke="#1B3A69" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-42" cy="14" r="9" fill="#F7C9C2" opacity="0.75"/><circle cx="42" cy="14" r="9" fill="#F7C9C2" opacity="0.75"/>
  </g>

  <!-- Dental mirror -->
  <g transform="translate(790 300) rotate(28)">
    <rect x="-8" y="0" width="16" height="210" rx="8" fill="url(#d_gold)"/>
    <circle cx="0" cy="-18" r="34" fill="#EEF2F8" stroke="#C7D2E4" stroke-width="4"/>
    <circle cx="-9" cy="-27" r="10" fill="#fff" opacity="0.8"/>
  </g>

  <!-- "1." badge -->
  <g transform="translate(430 210)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <circle r="40" fill="url(#d_gold)"/>
    <text x="0" y="13" text-anchor="middle" font-size="38" font-weight="800" fill="#12294B">1</text>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
