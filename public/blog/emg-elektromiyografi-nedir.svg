<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Ön koldaki yüzey elektrotları ve iğne elektrot ile ekranda altın renkli kas sinyali dalgalarını gösteren çizim">
  <defs>
    <linearGradient id="emg_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="emg_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="emg_skin" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="0" y2="545"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="emg_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="emg_glow" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#emg_bg)"/>
  <rect width="1200" height="675" fill="url(#emg_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="150" cy="110" r="170" fill="#fff" opacity="0.035"/>

  <!-- Kablolar -->
  <g fill="none" stroke="#9DB4D6" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M270 432 C 280 330 420 290 540 280 C 590 276 650 282 720 296"/>
    <path d="M390 434 C 400 370 480 335 560 326 C 600 322 650 326 720 336"/>
  </g>

  <!-- Monitör -->
  <g transform="translate(650 110)">
    <rect x="0" y="0" width="440" height="260" rx="22" fill="#EEF2F8" opacity="0.14"/>
    <rect x="14" y="14" width="412" height="232" rx="14" fill="url(#emg_screen)"/>
    <g stroke="#9DB4D6" stroke-width="1.2" opacity="0.22">
      <line x1="14" y1="72" x2="426" y2="72"/><line x1="14" y1="130" x2="426" y2="130"/><line x1="14" y1="188" x2="426" y2="188"/>
      <line x1="82" y1="14" x2="82" y2="246"/><line x1="152" y1="14" x2="152" y2="246"/><line x1="220" y1="14" x2="220" y2="246"/><line x1="290" y1="14" x2="290" y2="246"/><line x1="358" y1="14" x2="358" y2="246"/>
    </g>
    <path d="M28 130 L 70 130 L 78 122 L 86 140 L 92 130 L 128 130 L 136 108 L 146 186 L 156 60 L 166 162 L 174 130 L 214 130 L 220 120 L 228 146 L 234 130 L 262 130 L 270 92 L 280 176 L 290 48 L 300 170 L 308 130 L 346 130 L 352 122 L 358 140 L 364 130 L 412 130" fill="none" stroke="url(#emg_gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="190" y="260" width="60" height="30" fill="#EEF2F8" opacity="0.14"/>
    <rect x="150" y="288" width="140" height="12" rx="6" fill="#EEF2F8" opacity="0.14"/>
  </g>

  <!-- Ön kol ve el (avuç aşağıda, üstten görünüm) -->
  <g>
    <path d="M-30 404 C 120 400 300 410 452 428 L 452 518 C 300 532 120 540 -30 540 Z" fill="url(#emg_skin)"/>
    <rect x="566" y="426" width="168" height="25" rx="12.5" fill="url(#emg_skin)"/>
    <rect x="566" y="451" width="182" height="25" rx="12.5" fill="url(#emg_skin)"/>
    <rect x="566" y="476" width="172" height="25" rx="12.5" fill="url(#emg_skin)"/>
    <rect x="566" y="500" width="138" height="22" rx="11" fill="url(#emg_skin)"/>
    <path d="M440 426 C 500 418 560 420 616 426 L 616 522 C 560 528 500 526 440 518 Z" fill="url(#emg_skin)"/>
    <g fill="none" stroke="#9FB0CC" stroke-width="2.6" stroke-linecap="round" opacity="0.75">
      <path d="M640 451 L 724 451"/><path d="M640 476 L 716 476"/><path d="M640 500.5 L 690 500.5"/>
    </g>
    <g transform="translate(534 440) rotate(-20)">
      <rect x="0" y="-15" width="92" height="30" rx="15" fill="#E4EAF3"/>
    </g>
    <path d="M60 438 C 200 432 320 440 420 452" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Yüzey elektrotları -->
  <g>
    <circle cx="270" cy="456" r="24" fill="url(#emg_gold)"/><circle cx="270" cy="456" r="9" fill="#FFF7E0"/>
    <circle cx="390" cy="458" r="22" fill="url(#emg_gold)"/><circle cx="390" cy="458" r="8" fill="#FFF7E0"/>
  </g>

  <!-- İğne elektrot -->
  <g transform="translate(150 470) rotate(-35)">
    <rect x="-6" y="-104" width="12" height="44" rx="5" fill="#C7D2E4"/>
    <line x1="0" y1="-60" x2="0" y2="-8" stroke="#F2F5FA" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#E8C56A" stroke-linecap="round">
    <path d="M136 452 A 22 22 0 0 0 166 476" stroke-width="3" opacity="0.8"/>
    <path d="M124 444 A 38 38 0 0 0 176 490" stroke-width="3" opacity="0.45"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
