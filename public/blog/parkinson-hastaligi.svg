<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Parkinson hastalığı — uçlarından altın renkli dopamin parçacıkları salan stilize sinir hücresi ve çevresinde hafif titreşim halkaları">
  <defs>
    <linearGradient id="prk_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="prk_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="prk_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="prk_soma" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></radialGradient>
    <radialGradient id="prk_spark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.55"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#prk_bg)"/>
  <rect width="1200" height="675" fill="url(#prk_glow)"/>
  <circle cx="1080" cy="570" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="1000" cy="105" r="140" fill="#fff" opacity="0.025"/>

  <!-- Titreşim halkaları -->
  <g fill="none" stroke="#9DB4D6" stroke-linecap="round" opacity="0.35">
    <path d="M330 200 A 190 190 0 0 0 330 440" stroke-width="3"/>
    <path d="M290 170 A 240 240 0 0 0 290 470" stroke-width="2.5" opacity="0.7"/>
    <path d="M250 140 A 290 290 0 0 0 250 500" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Dendritler -->
  <g fill="none" stroke="#C7D2E4" stroke-linecap="round">
    <path d="M460 300 C 430 250 410 220 380 196" stroke-width="16"/>
    <path d="M380 196 C 370 170 372 150 360 130" stroke-width="8"/>
    <path d="M380 196 C 350 190 330 196 306 186" stroke-width="7"/>
    <path d="M500 270 C 510 220 520 190 540 160" stroke-width="14"/>
    <path d="M540 160 C 548 140 566 128 576 110" stroke-width="7"/>
    <path d="M540 160 C 528 140 520 132 508 116" stroke-width="6"/>
    <path d="M450 340 C 400 350 370 360 340 380" stroke-width="15"/>
    <path d="M340 380 C 320 384 304 378 288 384" stroke-width="7"/>
    <path d="M340 380 C 330 400 330 420 316 440" stroke-width="7"/>
    <path d="M480 370 C 470 420 460 450 440 480" stroke-width="13"/>
    <path d="M440 480 C 420 494 404 494 386 506" stroke-width="6"/>
    <path d="M440 480 C 444 504 440 520 446 540" stroke-width="6"/>
  </g>

  <!-- Akson ve miyelin kılıfları -->
  <path d="M530 330 C 620 340 700 360 800 382" fill="none" stroke="#B3C1D8" stroke-width="10" stroke-linecap="round"/>
  <g fill="#E4EAF3">
    <rect x="566" y="320" width="44" height="22" rx="11" transform="rotate(7 588 331)"/>
    <rect x="628" y="331" width="44" height="22" rx="11" transform="rotate(11 650 342)"/>
    <rect x="690" y="345" width="44" height="22" rx="11" transform="rotate(13 712 356)"/>
  </g>

  <!-- Hücre gövdesi -->
  <path d="M440 296 C 450 260 500 246 528 272 C 556 296 560 340 532 364 C 506 388 462 384 446 356 C 434 336 432 314 440 296 Z" fill="url(#prk_soma)"/>
  <circle cx="490" cy="318" r="22" fill="#9FB0CC" opacity="0.8"/>
  <circle cx="484" cy="312" r="7" fill="#F2F5FA" opacity="0.8"/>

  <!-- Akson uçları -->
  <g fill="none" stroke="#B3C1D8" stroke-width="7" stroke-linecap="round">
    <path d="M800 382 C 830 370 850 344 870 330"/>
    <path d="M800 382 C 836 386 860 392 890 398"/>
    <path d="M800 382 C 820 410 836 430 850 456"/>
  </g>
  <g fill="#DCE4F0">
    <circle cx="876" cy="326" r="15"/>
    <circle cx="898" cy="400" r="15"/>
    <circle cx="854" cy="464" r="15"/>
  </g>

  <!-- Dopamin parçacıkları -->
  <circle cx="930" cy="396" r="110" fill="url(#prk_spark)"/>
  <g fill="url(#prk_gold)">
    <circle cx="906" cy="310" r="10.15"/><circle cx="928" cy="330" r="7.25"/><circle cx="944" cy="300" r="5.8"/>
    <circle cx="930" cy="392" r="11.6"/><circle cx="954" cy="410" r="8.7"/><circle cx="972" cy="384" r="6.525"/><circle cx="996" cy="404" r="5.075"/>
    <circle cx="884" cy="494" r="8.7"/><circle cx="906" cy="478" r="6.525"/><circle cx="912" cy="512" r="5.075"/>
    <circle cx="960" cy="350" r="4.35"/><circle cx="950" cy="452" r="5.8"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
