<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yastıkta yatan başın yan kesitinde daralan hava yolu, titreşen yumuşak damak ve hilal ay">
  <defs>
    <linearGradient id="hor_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="hor_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="hor_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="hor_pillow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB4D6"/><stop offset="1" stop-color="#6F8DB8"/></linearGradient>
    <radialGradient id="hor_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hor_bg)"/>
  <rect width="1200" height="675" fill="url(#hor_glow)"/>
  <circle cx="1070" cy="580" r="210" fill="#fff" opacity="0.03"/>

  <!-- Ay ve yıldızlar -->
  <path d="M1000 96 A 66 66 0 1 0 1062 186 A 52 52 0 1 1 1000 96 Z" fill="url(#hor_gold)"/>
  <g fill="#DCE4F0">
    <circle cx="880" cy="120" r="4"/><circle cx="930" cy="214" r="3"/><circle cx="1110" cy="96" r="3.5"/><circle cx="820" cy="190" r="2.5"/>
  </g>

  <!-- Yastık -->
  <path d="M250 520 C 240 470 300 452 420 456 C 540 460 610 470 612 520 C 614 572 540 590 420 588 C 300 586 258 566 250 520 Z" fill="url(#hor_pillow)"/>

  <!-- Baş (sırtüstü, yüz yukarıda) -->
  <g transform="translate(430 380) rotate(-90)">
    <path d="M-60 290 C -70 180 -140 120 -140 20 C -140 -100 -60 -150 20 -150 C 90 -150 125 -100 128 -50 L 130 -30 C 128 -15 135 0 150 25 C 160 40 166 52 158 58 C 152 62 146 62 138 62 C 142 72 146 80 142 88 L 136 92 C 144 98 142 110 134 114 C 138 130 134 150 110 160 C 80 168 60 170 50 200 L 40 290 Z" fill="url(#hor_skin)"/>
    <!-- Kulak -->
    <ellipse cx="-30" cy="30" rx="22" ry="34" fill="#C7D2E4"/>
    <!-- Hava yolu: burun boşluğu → geniz → yutak -->
    <path d="M140 46 C 100 38 50 34 6 36 C -24 38 -34 62 -30 104 C -28 150 -20 210 -16 290" fill="none" stroke="#2A4E82" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M134 46 C 100 40 50 37 8 39 C -18 41 -27 62 -24 104 C -22 150 -16 210 -12 290" fill="none" stroke="#DCE4F0" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <!-- Ağız boşluğu ve dil -->
    <path d="M128 92 C 100 84 60 76 34 80" fill="none" stroke="#2A4E82" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 104 C 80 96 40 92 14 104 C -4 114 -10 140 -2 168 C 30 168 80 150 118 120 Z" fill="#9FB0CC"/>
    <!-- Titreşen yumuşak damak -->
    <path d="M40 66 C 30 68 22 72 16 80 C 12 86 6 88 2 96 C -2 104 -8 108 -10 116" fill="none" stroke="url(#hor_gold)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Battaniye / gövde -->
  <path d="M636 318 C 700 300 770 318 830 352 C 910 396 1060 404 1240 408 L 1240 700 L 640 700 C 600 600 596 400 636 318 Z" fill="#7F9BC4"/>
  <path d="M636 318 C 700 300 770 318 830 352 C 910 396 1060 404 1240 408" fill="none" stroke="#DCE4F0" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
  <path d="M700 470 C 820 452 980 470 1240 470" fill="none" stroke="#DCE4F0" stroke-width="3" opacity="0.25"/>

  <!-- Horlama ses dalgaları -->
  <g fill="none" stroke="url(#hor_gold)" stroke-linecap="round">
    <path d="M478 196 C 500 172 540 172 562 196" stroke-width="6"/>
    <path d="M458 166 C 492 130 548 130 582 166" stroke-width="6" opacity="0.7"/>
    <path d="M438 136 C 482 88 558 88 602 136" stroke-width="6" opacity="0.45"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
