<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Polikistik over sendromu — kenarında inci dizisi gibi küçük foliküller bulunan yumurtalık şeması ve düzensiz işaretli takvim">
  <defs>
    <linearGradient id="pko_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="pko_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="pko_glow" cx="0.42" cy="0.5" r="0.65"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.9"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="pko_ovary" cx="0.42" cy="0.38" r="0.75"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></radialGradient>
    <radialGradient id="pko_fol" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#2F5A93"/><stop offset="1" stop-color="#1D3D6C"/></radialGradient>
    <linearGradient id="pko_card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pko_bg)"/>
  <rect width="1200" height="675" fill="url(#pko_glow)"/>
  <circle cx="1080" cy="600" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="1030" cy="90" r="130" fill="#fff" opacity="0.025"/>

  <circle cx="470" cy="350" r="250" fill="none" stroke="url(#pko_gold)" stroke-width="2" opacity="0.25" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Yumurtalık -->
  <g transform="translate(470 350) rotate(-12)">
    <ellipse cx="0" cy="0" rx="210" ry="140" fill="url(#pko_ovary)" stroke="url(#pko_gold)" stroke-width="7"/>
    <ellipse cx="0" cy="0" rx="92" ry="52" fill="#DCE4F0" opacity="0.8"/>
    <!-- kenardaki foliküller (inci dizisi) -->
    <g fill="url(#pko_fol)" stroke="#9DB4D6" stroke-width="2.5" transform="scale(0.8)">
      <circle cx="-172" cy="0" r="22"/><circle cx="-160" cy="-52" r="21"/><circle cx="-126" cy="-92" r="22"/><circle cx="-76" cy="-118" r="21"/><circle cx="-20" cy="-128" r="22"/>
      <circle cx="36" cy="-126" r="21"/><circle cx="90" cy="-110" r="22"/><circle cx="136" cy="-80" r="21"/><circle cx="166" cy="-36" r="22"/><circle cx="172" cy="18" r="21"/>
      <circle cx="152" cy="68" r="22"/><circle cx="112" cy="106" r="21"/><circle cx="60" cy="126" r="22"/><circle cx="4" cy="130" r="21"/><circle cx="-52" cy="124" r="22"/>
      <circle cx="-104" cy="104" r="21"/><circle cx="-146" cy="64" r="22"/>
    </g>
  </g>

  <!-- Takvim kartı -->
  <g transform="translate(820 180)">
    <rect x="0" y="0" width="270" height="300" rx="24" fill="url(#pko_card)"/>
    <rect x="0" y="0" width="270" height="62" rx="24" fill="#9DB4D6"/>
    <rect x="0" y="38" width="270" height="24" fill="#9DB4D6"/>
    <rect x="62" y="-14" width="14" height="40" rx="7" fill="#C7D2E4"/>
    <rect x="194" y="-14" width="14" height="40" rx="7" fill="#C7D2E4"/>
    <g fill="#C7D2E4">
      <circle cx="44" cy="104" r="12"/><circle cx="90" cy="104" r="12"/><circle cx="136" cy="104" r="12"/><circle cx="182" cy="104" r="12"/><circle cx="228" cy="104" r="12"/>
      <circle cx="44" cy="152" r="12"/><circle cx="90" cy="152" r="12"/><circle cx="136" cy="152" r="12"/><circle cx="182" cy="152" r="12"/><circle cx="228" cy="152" r="12"/>
      <circle cx="44" cy="200" r="12"/><circle cx="90" cy="200" r="12"/><circle cx="136" cy="200" r="12"/><circle cx="182" cy="200" r="12"/><circle cx="228" cy="200" r="12"/>
      <circle cx="44" cy="248" r="12"/><circle cx="90" cy="248" r="12"/><circle cx="136" cy="248" r="12"/><circle cx="182" cy="248" r="12"/><circle cx="228" cy="248" r="12"/>
    </g>
    <!-- düzensiz işaretli günler -->
    <g fill="url(#pko_gold)">
      <circle cx="90" cy="104" r="14"/><circle cx="228" cy="152" r="14"/><circle cx="44" cy="248" r="14"/>
    </g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
