<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Guatr — boyun önünde normalden büyük kelebek biçimli tiroid bezi, büyümeyi gösteren kesikli altın çizgiler ve iyotlu tuzu simgeleyen tuzluk">
  <defs>
    <linearGradient id="gua_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="gua_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="gua_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="gua_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="gua_glow" cx="0.55" cy="0.48" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#gua_bg)"/>
  <rect width="1200" height="675" fill="url(#gua_glow)"/>
  <circle cx="1070" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <g transform="translate(-70 0)">
    <!-- Baş, boyun ve omuzlar -->
    <path d="M536 200 C 535 300 530 400 502 460 C 420 502 318 560 300 675 L 900 675 C 882 560 780 502 698 460 C 670 400 665 300 664 200 Z" fill="url(#gua_skin)"/>
    <ellipse cx="600" cy="120" rx="112" ry="132" fill="url(#gua_skin)"/>
    <path d="M536 214 C 552 240 572 252 600 254 C 628 252 648 240 664 214 L 664 226 C 646 256 626 268 600 270 C 574 268 554 256 536 226 Z" fill="#C7D2E4" opacity="0.8"/>
    <!-- Boyundaki şişlik -->
    <ellipse cx="600" cy="384" rx="98" ry="74" fill="#E4EAF3"/>
    <!-- Soluk borusu -->
    <rect x="576" y="276" width="48" height="196" rx="18" fill="#C7D2E4" opacity="0.9"/>
    <path d="M574 276 L 626 276 L 616 304 L 584 304 Z" fill="#9FB0CC" opacity="0.8"/>
    <!-- Büyüme halkaları -->
    <g fill="none" stroke="url(#gua_gold)" stroke-linecap="round">
      <ellipse cx="600" cy="384" rx="128" ry="98" stroke-width="4" stroke-dasharray="4 14" opacity="0.85"/>
      <ellipse cx="600" cy="384" rx="160" ry="124" stroke-width="3" stroke-dasharray="3 16" opacity="0.45"/>
    </g>
    <!-- Büyümüş tiroid bezi -->
    <g fill="url(#gua_gold)">
      <ellipse cx="552" cy="384" rx="48" ry="74" transform="rotate(-14 552 384)"/>
      <ellipse cx="648" cy="384" rx="48" ry="74" transform="rotate(14 648 384)"/>
      <rect x="548" y="388" width="104" height="38" rx="18"/>
    </g>
    <g fill="#FFF7E0" opacity="0.45">
      <ellipse cx="540" cy="356" rx="12" ry="26" transform="rotate(-14 540 356)"/>
      <ellipse cx="636" cy="356" rx="12" ry="26" transform="rotate(14 636 356)"/>
    </g>
  </g>

  <!-- Tuzluk -->
  <g transform="translate(930 300)">
    <g fill="#F2F5FA" opacity="0.85"><circle cx="-62" cy="-96" r="4"/><circle cx="-84" cy="-70" r="3.5"/><circle cx="-50" cy="-58" r="3"/><circle cx="-96" cy="-112" r="3"/></g>
    <path d="M-52 -48 C -52 -112 52 -112 52 -48 Z" fill="#C7D2E4"/>
    <g fill="#5C7299"><circle cx="-18" cy="-78" r="4.5"/><circle cx="0" cy="-86" r="4.5"/><circle cx="18" cy="-78" r="4.5"/><circle cx="-8" cy="-64" r="4"/><circle cx="10" cy="-64" r="4"/></g>
    <rect x="-60" y="-50" width="120" height="16" rx="6" fill="#9FB0CC"/>
    <path d="M-56 -34 L 56 -34 L 70 196 C 70 210 60 220 46 220 L -46 220 C -60 220 -70 210 -70 196 Z" fill="url(#gua_skin)"/>
    <rect x="-68" y="70" width="136" height="56" fill="url(#gua_gold)"/>
    <circle cx="0" cy="98" r="16" fill="#FFF7E0" opacity="0.9"/>
    <path d="M-40 -16 L -48 180" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
