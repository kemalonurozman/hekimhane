    <ellipse cx="700" cy="462" rx="24" ry="18" transform="rotate(-30 700 462)"/>
  </g>

  <!-- Kasık bağı çizgileri -->
  <g fill="none" stroke="#F2F5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.8">
    <path d="M322 262 C 400 340 480 430 572 498"/>
    <path d="M878 262 C 800 340 720 430 628 498"/>
  </g>

  <!-- Fıtık kesesi (sağ kasık) -->
  <circle cx="522" cy="404" r="32" fill="url(#ksk_dome)" stroke="#9FB0CC" stroke-width="3"/>
  <ellipse cx="512" cy="393" rx="11" ry="6.5" fill="#fff" opacity="0.8" transform="rotate(-30 512 393)"/>

  <!-- Ağ yama -->
  <g transform="translate(518 410) rotate(43)">
    <rect x="-92" y="-56" width="184" height="112" rx="18" fill="#E8C56A" fill-opacity="0.12" stroke="url(#ksk_gold)" stroke-width="5"/>
    <g stroke="#E8C56A" stroke-width="1.6" opacity="0.65"><line x1="-66" y1="-46" x2="-66" y2="46"/><line x1="-44" y1="-46" x2="-44" y2="46"/><line x1="-22" y1="-46" x2="-22" y2="46"/><line x1="0" y1="-46" x2="0" y2="46"/><line x1="22" y1="-46" x2="22" y2="46"/><line x1="44" y1="-46" x2="44" y2="46"/><line x1="66" y1="-46" x2="66" y2="46"/><line x1="-82" y1="-44" x2="82" y2="-44"/><line x1="-82" y1="-22" x2="82" y2="-22"/><line x1="-82" y1="0" x2="82" y2="0"/><line x1="-82" y1="22" x2="82" y2="22"/><line x1="-82" y1="44" x2="82" y2="44"/></g>
  </g>

  <!-- Odak halkaları -->
  <g fill="none" stroke="url(#ksk_gold)" stroke-linecap="round">
    <circle cx="518" cy="410" r="136" stroke-width="2.5" stroke-dasharray="3 12" opacity="0.45"/>
    <circle cx="518" cy="410" r="176" stroke-width="2" stroke-dasharray="2 14" opacity="0.25"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
