<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Kasık bölgesindeki karın duvarı katmanında küçük bir açıklık ve onu örten altın renkli ağ yama şeması">
  <defs>
    <linearGradient id="ksk_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="ksk_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="ksk_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="ksk_bone" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="530"><stop offset="0" stop-color="#DCE4F0"/><stop offset="1" stop-color="#AFC0DA"/></linearGradient>
    <radialGradient id="ksk_dome" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D2E4"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ksk_bg)"/>
  <rect width="1200" height="675" fill="url(#ksk_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

  <!-- Leğen kemiği şeması -->
  <g fill="url(#ksk_bone)" opacity="0.55">
    <path d="M585 232 C 540 182 430 140 350 158 C 302 170 290 222 316 272 C 338 314 376 350 404 392 L 468 384 C 498 334 545 304 585 292 Z"/><path d="M 615 232 C 660 182 770 140 850 158 C 898 170 910 222 884 272 C 862 314 824 350 796 392 L 732 384 C 702 334 655 304 615 292 Z"/>
    <path d="M398 380 C 390 436 418 478 468 504 C 510 524 556 530 590 524 L 590 474 C 560 474 530 458 514 432 C 504 414 488 398 470 382 Z"/><path d="M 802 380 C 810 436 782 478 732 504 C 690 524 644 530 610 524 L 610 474 C 640 474 670 458 686 432 C 696 414 712 398 730 382 Z"/>
    <path d="M560 226 L 640 226 L 626 330 C 616 362 584 362 574 330 Z"/>
  </g>
  <g fill="#12294B" opacity="0.55">
