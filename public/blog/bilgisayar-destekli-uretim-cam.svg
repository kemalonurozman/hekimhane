    <line x1="340" y1="264" x2="640" y2="264"/><line x1="340" y1="278" x2="640" y2="278"/><line x1="340" y1="292" x2="640" y2="292"/>
    <line x1="340" y1="306" x2="640" y2="306"/><line x1="340" y1="320" x2="640" y2="320"/><line x1="340" y1="334" x2="640" y2="334"/>
    <line x1="340" y1="348" x2="640" y2="348"/><line x1="340" y1="362" x2="640" y2="362"/><line x1="340" y1="376" x2="640" y2="376"/>
    <line x1="340" y1="390" x2="640" y2="390"/><line x1="340" y1="404" x2="640" y2="404"/><line x1="340" y1="418" x2="640" y2="418"/>
