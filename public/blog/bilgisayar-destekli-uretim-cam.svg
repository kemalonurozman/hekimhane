<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yapı plakasından sarkan, katman katman basılmış bir azı dişi kronu, altında ışık yayan reçine haznesi ve sağda seramik bloğu işleyen freze ucunu gösteren çizim">
