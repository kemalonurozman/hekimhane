    <clipPath id="cam_clip"><path d="M360 262 C 358 225 382 207 408 211 C 428 214 440 231 455 231 C 471 231 479 212 500 210 C 522 208 532 229 548 229 C 565 229 575 209 596 211 C 621 214 626 240 622 270 C 618 320 610 360 600 395 C 592 420 570 430 545 428 L 415 428 C 390 430 370 420 364 395 C 356 360 362 300 360 262 Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#cam_bg)"/>
