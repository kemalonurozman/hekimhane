    <path d="M30 342 C 70 330 140 330 182 342" fill="none" stroke="url(#cam_gold)" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
    <path d="M30 470 L 30 342" fill="none" stroke="#E8C56A" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.6"/>
    <rect x="96" y="486" width="20" height="40" rx="4" fill="#9DB4D6" opacity="0.45"/>
    <rect x="40" y="526" width="132" height="16" rx="8" fill="#EEF2F8" opacity="0.14"/>
