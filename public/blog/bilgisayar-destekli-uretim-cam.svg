    <linearGradient id="cam_tooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="cam_beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.55"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="cam_resin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
