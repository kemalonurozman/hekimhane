    <rect x="398" y="498" width="14" height="14" rx="2"/><rect x="418" y="498" width="14" height="14" rx="2"/><rect x="438" y="498" width="14" height="14" rx="2"/>
    <rect x="458" y="498" width="14" height="14" rx="2"/><rect x="478" y="498" width="14" height="14" rx="2"/><rect x="498" y="498" width="14" height="14" rx="2"/>
    <rect x="518" y="498" width="14" height="14" rx="2"/><rect x="538" y="498" width="14" height="14" rx="2"/><rect x="558" y="498" width="14" height="14" rx="2"/>
  </g>
