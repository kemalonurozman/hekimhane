    <linearGradient id="bgr_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="bgr_villus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="bgr_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="bgr_lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20416F"/><stop offset="1" stop-color="#16325C"/></linearGradient>
    <clipPath id="bgr_mag"><circle cx="975" cy="330" r="104"/></clipPath>
