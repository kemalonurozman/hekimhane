<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yandan görülen ayak tabanında topuktan parmaklara uzanan altın renkli bağ dokusu ve topukta ağrı noktası">
  <defs>
    <linearGradient id="topf_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="topf_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="topf_bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="topf_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="topf_hot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.6"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#topf_bg)"/>
  <rect width="1200" height="675" fill="url(#topf_glow)"/>
  <circle cx="1060" cy="140" r="170" fill="#fff" opacity="0.03"/>
  <circle cx="170" cy="580" r="170" fill="#fff" opacity="0.025"/>

  <!-- Zemin -->
  <line x1="220" y1="556" x2="1060" y2="556" stroke="#9DB4D6" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Ayak ve bacak silueti (iç yandan) -->
  <path d="M392 -10 C 388 150 380 262 360 330 C 330 384 300 430 304 480 C 308 516 334 534 374 536 C 440 538 474 504 562 494 C 662 488 762 522 852 534 C 902 540 962 540 992 530 C 1008 522 1004 500 984 494 C 904 480 824 452 744 420 C 644 380 566 344 528 300 C 512 250 512 150 516 -10 Z" fill="#fff" opacity="0.08"/>

  <!-- Kemikler -->
  <g fill="url(#topf_bone)">
    <!-- kaval kemiği -->
    <path d="M420 -10 L 494 -10 L 496 300 C 498 322 486 338 468 340 L 440 340 C 424 338 414 322 418 300 Z"/>
    <!-- aşık kemiği (talus) -->
    <path d="M408 360 C 420 326 470 316 512 334 C 544 348 556 376 548 398 C 528 412 470 414 428 404 C 410 398 402 380 408 360 Z"/>
    <!-- topuk kemiği (kalkaneus) -->
    <path d="M330 452 C 326 418 352 396 392 396 C 440 396 500 404 532 420 C 550 432 548 456 528 470 C 500 488 470 504 444 512 C 400 524 352 520 336 496 C 330 484 330 468 330 452 Z"/>
    <!-- orta ayak kemikleri -->
    <path d="M556 392 C 584 384 616 392 632 404 C 640 420 634 446 616 458 C 596 466 566 460 552 446 C 540 428 542 402 556 392 Z"/>
    <path d="M640 410 C 664 406 690 414 700 428 C 704 446 694 466 676 472 C 656 476 640 466 634 452 C 628 436 630 418 640 410 Z"/>
    <!-- tarak kemikleri -->
    <path d="M700 432 C 760 450 820 476 860 494 C 872 500 872 518 858 520 C 818 516 760 496 704 474 C 690 466 688 440 700 432 Z"/>
    <!-- parmak kemikleri -->
    <rect x="872" y="500" width="50" height="20" rx="10" transform="rotate(6 897 510)"/>
    <rect x="928" y="506" width="40" height="18" rx="9" transform="rotate(8 948 515)"/>
    <circle cx="866" cy="516" r="11"/>
  </g>
  <!-- Aşil tendonu -->
  <path d="M398 120 C 396 250 380 340 344 430" fill="none" stroke="#C7D2E4" stroke-width="14" stroke-linecap="round" opacity="0.45"/>

  <!-- Plantar fasya -->
  <path d="M410 520 C 500 506 600 480 700 496 C 780 508 830 520 872 524" fill="none" stroke="url(#topf_gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M872 524 C 910 530 940 532 966 530" fill="none" stroke="#E8C56A" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Ağrı noktası -->
  <circle cx="422" cy="516" r="80" fill="url(#topf_hot)"/>
  <!-- Topuk dikeni (kemik çıkıntısı) -->
  <path d="M432 500 C 450 500 470 504 488 510 C 470 514 450 516 436 516 Z" fill="#F2F5FA"/>
  <g fill="none" stroke="#E8C56A" stroke-linecap="round">
    <path d="M370 590 A 60 60 0 0 0 474 590" stroke-width="3.5" opacity="0.8"/>
    <path d="M346 614 A 92 92 0 0 0 498 614" stroke-width="3" opacity="0.45"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
