<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Genital siğil — büyüteç altında cilt yüzeyindeki küçük kabarıklık ve altın kalkanlı virüs simgesi">
  <defs>
    <linearGradient id="gsg_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="gsg_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="gsg_glow" cx="0.5" cy="0.5" r="0.65"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.9"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="gsg_skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="gsg_layer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB0CC"/><stop offset="1" stop-color="#7F95B8"/></linearGradient>
    <radialGradient id="gsg_lens" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#2F5A93" stop-opacity="0.55"/><stop offset="1" stop-color="#1D3D6C" stop-opacity="0.3"/></radialGradient>
    <clipPath id="gsg_clip"><circle cx="520" cy="330" r="168"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#gsg_bg)"/>
  <rect width="1200" height="675" fill="url(#gsg_glow)"/>
  <circle cx="1080" cy="600" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="1020" cy="100" r="130" fill="#fff" opacity="0.025"/>

  <!-- Cilt katmanı (geniş) -->
  <path d="M0 560 C 200 545 400 570 600 558 C 800 546 1000 568 1200 556 L 1200 675 L 0 675 Z" fill="url(#gsg_layer)" opacity="0.12"/>

  <!-- Büyüteç içi: büyütülmüş cilt kesiti -->
  <g clip-path="url(#gsg_clip)">
    <rect x="340" y="150" width="360" height="360" fill="url(#gsg_lens)"/>
    <path d="M330 380 C 400 372 430 378 460 376 L 580 376 C 610 378 650 372 720 380 L 720 520 L 330 520 Z" fill="url(#gsg_skin)"/>
    <path d="M330 430 C 420 424 500 436 580 428 C 640 422 690 432 720 428 L 720 520 L 330 520 Z" fill="#C7D2E4"/>
    <path d="M330 470 C 420 466 500 476 580 468 C 640 462 690 472 720 468 L 720 520 L 330 520 Z" fill="#9FB0CC"/>
    <!-- küçük kabarıklık kümesi -->
    <g fill="#DCE4F0" stroke="#9FB0CC" stroke-width="2">
      <circle cx="490" cy="364" r="20"/><circle cx="520" cy="350" r="24"/><circle cx="552" cy="362" r="20"/><circle cx="506" cy="336" r="16"/><circle cx="536" cy="332" r="16"/>
    </g>
    <path d="M498 340 A 14 14 0 0 1 512 326" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Büyüteç çerçevesi ve sap -->
  <circle cx="520" cy="330" r="168" fill="none" stroke="url(#gsg_gold)" stroke-width="16"/>
  <circle cx="520" cy="330" r="150" fill="none" stroke="#FFF7E0" stroke-width="2" opacity="0.4"/>
  <path d="M640 450 L 738 548" stroke="url(#gsg_gold)" stroke-width="34" stroke-linecap="round"/>
  <path d="M396 250 A 140 140 0 0 1 470 196" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Virüs simgesi ve kalkan -->
  <g transform="translate(880 230)">
    <circle r="54" fill="#C7D2E4"/>
    <g fill="#F2F5FA" stroke="#9FB0CC" stroke-width="2">
      <circle cx="0" cy="0" r="10"/><circle cx="0" cy="-26" r="9"/><circle cx="23" cy="-13" r="9"/><circle cx="23" cy="13" r="9"/><circle cx="0" cy="26" r="9"/><circle cx="-23" cy="13" r="9"/><circle cx="-23" cy="-13" r="9"/>
    </g>
    <g fill="#C7D2E4"><circle cx="0" cy="-62" r="7"/><circle cx="54" cy="-31" r="7"/><circle cx="54" cy="31" r="7"/><circle cx="0" cy="62" r="7"/><circle cx="-54" cy="31" r="7"/><circle cx="-54" cy="-31" r="7"/></g>
  </g>
  <g transform="translate(960 330)">
    <path d="M0 -70 C 26 -55 48 -52 66 -52 C 66 -8 55 40 0 70 C -55 40 -66 -8 -66 -52 C -48 -52 -26 -55 0 -70 Z" fill="url(#gsg_gold)"/>
    <path d="M-24 0 L -6 18 L 28 -18" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
