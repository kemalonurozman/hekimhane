<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diş hekimi seçerken dikkat edilmesi gereken kriterler — kontrol listesi ve diş simgesi">
  <defs>
    <linearGradient id="a_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/>
    </linearGradient>
    <linearGradient id="a_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#D4A843"/>
    </linearGradient>
    <radialGradient id="a_glow" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#a_bg)"/>
  <rect width="1200" height="675" fill="url(#a_glow)"/>
  <circle cx="1050" cy="110" r="230" fill="#fff" opacity="0.035"/>
  <circle cx="150" cy="600" r="190" fill="#fff" opacity="0.03"/>

  <!-- Kontrol listesi kartı -->
  <g transform="translate(360 190)">
    <rect x="-30" y="-24" width="360" height="330" rx="26" fill="#fff" opacity="0.10"/>
    <rect x="0" y="0" width="300" height="290" rx="20" fill="#fff"/>
    <rect x="26" y="-16" width="120" height="34" rx="10" fill="url(#a_gold)"/>
    <g>
      <circle cx="46" cy="70" r="16" fill="url(#a_gold)"/><path d="M39 70l5 5 9-10" fill="none" stroke="#12294B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="76" y="62" width="180" height="15" rx="7.5" fill="#1B3A69" opacity="0.85"/>
      <circle cx="46" cy="126" r="16" fill="url(#a_gold)"/><path d="M39 126l5 5 9-10" fill="none" stroke="#12294B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="76" y="118" width="150" height="15" rx="7.5" fill="#1B3A69" opacity="0.7"/>
      <circle cx="46" cy="182" r="16" fill="url(#a_gold)"/><path d="M39 182l5 5 9-10" fill="none" stroke="#12294B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="76" y="174" width="168" height="15" rx="7.5" fill="#1B3A69" opacity="0.85"/>
      <circle cx="46" cy="238" r="16" fill="#E5E5EA"/>
      <rect x="76" y="230" width="120" height="15" rx="7.5" fill="#C9CDD6"/>
    </g>
  </g>

  <!-- Diş + onay rozeti -->
  <g transform="translate(830 355) scale(1.35)">
    <path d="M0 -72 C -46 -72 -84 -44 -84 2 C -84 40 -72 70 -58 92 C -49 106 -35 108 -29 92 C -22 74 -14 66 0 66 C 14 66 22 74 29 92 C 35 108 49 106 58 92 C 72 70 84 40 84 2 C 84 -44 46 -72 0 -72 Z" fill="#fff"/>
    <path d="M-42 -30 C -34 -46 -14 -50 -2 -42" fill="none" stroke="#C9D6EA" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <g transform="translate(52 46)">
      <circle r="30" fill="url(#a_gold)"/><path d="M-13 0l9 9 17 -19" fill="none" stroke="#12294B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/>
    <rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
