    <path d="M420 330 L 452 330 L 464 262 L 478 410 L 492 228 L 506 438 L 520 250 L 534 404 L 548 280 L 562 380 L 576 300 L 590 362 C 606 318 622 318 638 342 C 656 370 672 370 690 344 C 710 318 730 318 750 338 C 772 358 794 358 816 342 C 838 328 860 328 882 338 L 960 338" stroke="url(#pnk_gold)" stroke-width="7"/>
    <path d="M420 384 L 456 384 L 470 350 L 484 430 L 498 336 L 512 440 L 526 356 L 540 418 L 556 370 L 572 400 C 600 380 630 380 660 392 C 700 406 740 406 780 394 C 820 384 860 384 960 390" stroke="#9DB4D6" stroke-width="3" opacity="0.55"/>
