    <radialGradient id="pnk_glow" cx="0.55" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <clipPath id="pnk_clip"><path d="M556 675 L 556 572 C 480 530 432 446 440 350 C 452 230 560 150 690 150 C 810 150 892 228 900 330 L 902 352 L 938 420 C 944 432 936 440 924 440 L 906 440 L 908 468 C 910 478 902 484 896 486 C 904 492 904 500 896 506 L 890 540 C 884 562 860 570 830 566 L 780 560 L 780 675 Z"/></clipPath>
