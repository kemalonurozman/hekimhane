<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Profilden baş silueti içinde dalgalanan sivri çizgilerin yatışarak sakin, düzenli bir dalgaya dönüştüğü soyut çizim">
