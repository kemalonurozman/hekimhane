  <rect width="1200" height="675" fill="url(#pnk_bg)"/>
  <rect width="1200" height="675" fill="url(#pnk_glow)"/>
  <circle cx="1080" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="110" r="150" fill="#fff" opacity="0.025"/>

