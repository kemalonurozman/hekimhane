<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Meme kanseri — altın renkli farkındalık kurdelesi, arkasında açık mavi kalkan ve çevresinde tarama halkaları">
  <defs>
    <linearGradient id="mk_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="mk_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="mk_gold2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0D27F"/><stop offset="1" stop-color="#D8AE4C"/></linearGradient>
    <linearGradient id="mk_shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="mk_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#mk_bg)"/>
  <rect width="1200" height="675" fill="url(#mk_glow)"/>
  <circle cx="1070" cy="560" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="120" r="150" fill="#fff" opacity="0.025"/>

  <!-- Tarama halkaları -->
  <g fill="none" stroke-linecap="round">
    <circle cx="600" cy="345" r="250" stroke="#9DB4D6" stroke-width="2" opacity="0.22"/>
    <circle cx="600" cy="345" r="300" stroke="url(#mk_gold)" stroke-width="2.5" opacity="0.35" stroke-dasharray="3 14"/>
    <circle cx="600" cy="345" r="200" stroke="#9DB4D6" stroke-width="1.5" opacity="0.18" stroke-dasharray="2 10"/>
  </g>
  <!-- Halka üzerindeki noktalar -->
  <g fill="url(#mk_gold)">
    <circle cx="350" cy="345" r="7"/><circle cx="850" cy="345" r="7"/>
    <circle cx="423" cy="168" r="5" opacity="0.8"/><circle cx="777" cy="522" r="5" opacity="0.8"/>
  </g>
  <g fill="#C7D2E4" opacity="0.7">
    <circle cx="777" cy="168" r="4.5"/><circle cx="423" cy="522" r="4.5"/>
  </g>

  <!-- Kalkan -->
  <path d="M600 140 C 660 172 720 184 778 184 C 778 330 740 470 600 552 C 460 470 422 330 422 184 C 480 184 540 172 600 140 Z" fill="url(#mk_shield)" opacity="0.16"/>
  <path d="M600 168 C 652 196 704 206 752 207 C 750 330 716 448 600 520 C 484 448 450 330 448 207 C 496 206 548 196 600 168 Z" fill="none" stroke="#F2F5FA" stroke-width="3" opacity="0.5"/>

  <!-- Kurdele: arkadaki kol -->
  <path d="M566 318 L 668 498" fill="none" stroke="url(#mk_gold)" stroke-width="40" stroke-linecap="butt"/>
  <!-- Kurdele: öndeki kolun gölge çizgisi ve ilmek -->
  <path d="M540 484 L 634 318" fill="none" stroke="#12294B" stroke-width="50" stroke-linecap="butt" opacity="0.35"/>
  <path d="M532 498 L 634 318 C 668 256 648 214 600 214 C 552 214 532 256 566 318" fill="none" stroke="url(#mk_gold2)" stroke-width="40" stroke-linejoin="round"/>
  <!-- Parlama -->
  <path d="M590 232 C 566 236 560 262 574 290" fill="none" stroke="#FFF7E0" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Küçük ışıltılar -->
  <g fill="#F2F5FA" opacity="0.55">
    <path d="M872 214 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z"/>
    <path d="M318 470 l 4 9 l 9 4 l -9 4 l -4 9 l -4 -9 l -9 -4 l 9 -4 Z"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
