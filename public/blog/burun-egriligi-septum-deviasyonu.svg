<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Burun boşluğunun kesit şemasında altın renkli eğri bölme duvarı ve iki yandan geçen hava akımı çizgileri">
  <defs>
    <linearGradient id="sep_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="sep_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="sep_tissue" gradientUnits="userSpaceOnUse" x1="0" y1="92" x2="0" y2="610"><stop offset="0" stop-color="#E4EAF3"/><stop offset="1" stop-color="#B4C3DB"/></linearGradient>
    <clipPath id="sep_cav"><path d="M572 140 L 628 140 C 650 220 700 330 760 440 C 780 478 790 515 780 545 C 774 562 758 570 740 570 L 460 570 C 442 570 426 562 420 545 C 410 515 420 478 440 440 C 500 330 550 220 572 140 Z"/></clipPath>
    <linearGradient id="sep_air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="sep_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sep_bg)"/>
  <rect width="1200" height="675" fill="url(#sep_glow)"/>
  <circle cx="1070" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="120" r="150" fill="#fff" opacity="0.025"/>

  <!-- Yüz kesiti dokusu -->
  <path d="M600 92 C 700 92 800 130 860 210 C 920 290 940 420 920 520 C 905 585 840 610 760 610 L 440 610 C 360 610 295 585 280 520 C 260 420 280 290 340 210 C 400 130 500 92 600 92 Z" fill="url(#sep_tissue)"/>
  <!-- Üst çene sinüsleri -->
  <ellipse cx="372" cy="430" rx="54" ry="92" fill="url(#sep_air)" opacity="0.55"/>
  <ellipse cx="828" cy="430" rx="54" ry="92" fill="url(#sep_air)" opacity="0.55"/>

  <!-- Burun boşluğu (hava yolu) -->
  <path d="M572 140 L 628 140 C 650 220 700 330 760 440 C 780 478 790 515 780 545 C 774 562 758 570 740 570 L 460 570 C 442 570 426 562 420 545 C 410 515 420 478 440 440 C 500 330 550 220 572 140 Z" fill="url(#sep_air)"/>

  <!-- Konkalar (sol) -->
  <g fill="url(#sep_tissue)" clip-path="url(#sep_cav)">
    <path d="M530 236 C 556 232 566 252 552 266 C 540 276 520 272 512 262 Z"/>
    <path d="M492 312 C 540 300 562 328 548 352 C 534 372 494 372 470 356 Z"/>
    <path d="M452 420 C 520 398 556 432 544 470 C 532 504 476 508 432 488 Z"/>
  </g>
  <!-- Konkalar (sağ) -->
  <g fill="url(#sep_tissue)" clip-path="url(#sep_cav)">
    <path d="M670 236 C 644 232 634 252 648 266 C 660 276 680 272 688 262 Z"/>
    <path d="M708 312 C 660 300 638 328 652 352 C 666 372 706 372 730 356 Z"/>
    <path d="M748 420 C 690 404 658 432 668 466 C 678 498 726 504 768 488 Z"/>
  </g>

  <!-- Hava akımı: sağda geniş, solda daralmış -->
  <g fill="none" stroke-linecap="round">
    
    <path d="M700 552 C 690 512 640 500 628 452 C 618 412 660 392 640 352 C 626 324 618 300 616 250" stroke="#DCE4F0" stroke-width="5" stroke-dasharray="2 14" opacity="0.9"/>
    <path d="M736 552 C 728 520 690 512 682 480 C 676 456 690 420 690 392" stroke="#DCE4F0" stroke-width="5" stroke-dasharray="2 14" opacity="0.7"/>
    <path d="M488 552 C 500 530 530 520 540 500" stroke="#DCE4F0" stroke-width="5" stroke-dasharray="2 14" opacity="0.6"/>
  </g>

  <!-- Eğri septum -->
  <path d="M600 132 C 600 190 612 230 608 280 C 604 330 546 360 546 420 C 546 470 596 500 600 572" fill="none" stroke="url(#sep_gold)" stroke-width="18" stroke-linecap="round"/>
  <!-- Damak (taban) -->
  <path d="M430 590 C 520 604 680 604 770 590" fill="none" stroke="#9FB0CC" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Vurgu halkası: daralan bölge -->
  <circle cx="538" cy="430" r="62" fill="none" stroke="url(#sep_gold)" stroke-width="3" stroke-dasharray="4 10" opacity="0.65"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
