<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Lenfoma — fasulye biçimli lenf bezi kesiti, ona bağlanan lenf damarları ve çevresinde yuvarlak lenfosit hücreleri">
  <defs>
    <linearGradient id="lnf_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="lnf_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="lnf_node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="lnf_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="lnf_germ" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F0D27F"/><stop offset="1" stop-color="#C99A34"/></radialGradient>
    <clipPath id="lnf_clip"><path d="M430 230 C 500 170 640 178 720 218 C 790 254 806 292 764 322 C 736 342 736 362 764 382 C 806 414 784 464 712 494 C 620 532 470 524 420 462 C 368 400 370 280 430 230 Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#lnf_bg)"/>
  <rect width="1200" height="675" fill="url(#lnf_glow)"/>
  <circle cx="1070" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1020" cy="120" r="150" fill="#fff" opacity="0.025"/>

  <!-- Gelen lenf damarları -->
  <g fill="none" stroke="#9DB4D6" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M300 170 C 350 190 390 205 440 236"/>
    <path d="M200 352 C 260 350 320 348 378 348"/>
    <path d="M290 560 C 340 530 380 505 430 474"/>
  </g>
  <g fill="#9DB4D6" opacity="0.8">
    <path d="M352 184 l 14 4 l -10 11 Z"/>
    <path d="M300 342 l 12 8 l -12 8 Z"/>
    <path d="M354 520 l 13 -2 l -6 13 Z"/>
  </g>

  <!-- Çıkan damarlar (hilus) -->
  <g fill="none" stroke-linecap="round">
    <path d="M748 344 C 820 330 880 300 960 300 C 1020 300 1060 320 1110 340" stroke="url(#lnf_gold)" stroke-width="10"/>
    <path d="M750 360 C 830 372 890 400 970 404 C 1030 406 1070 392 1120 380" stroke="#C7D2E4" stroke-width="7" opacity="0.7"/>
  </g>

  <!-- Lenf bezi -->
  <path d="M430 230 C 500 170 640 178 720 218 C 790 254 806 292 764 322 C 736 342 736 362 764 382 C 806 414 784 464 712 494 C 620 532 470 524 420 462 C 368 400 370 280 430 230 Z" fill="url(#lnf_node)"/>
  <g clip-path="url(#lnf_clip)">
    <!-- Medulla kordonları -->
    <g fill="none" stroke="#9FB0CC" stroke-width="10" stroke-linecap="round" opacity="0.55">
      <path d="M520 300 C 600 310 680 330 748 350"/>
      <path d="M500 360 C 590 356 670 352 748 352"/>
      <path d="M520 420 C 600 400 680 376 748 356"/>
      <path d="M600 260 C 650 290 700 320 748 348"/>
      <path d="M600 450 C 650 418 700 386 748 358"/>
    </g>
    <!-- Kapsül iç çizgisi -->
    <path d="M430 230 C 500 170 640 178 720 218 C 790 254 806 292 764 322 C 736 342 736 362 764 382 C 806 414 784 464 712 494 C 620 532 470 524 420 462 C 368 400 370 280 430 230 Z" fill="none" stroke="#9FB0CC" stroke-width="22" opacity="0.35"/>
  </g>
  <!-- Korteks foliküller -->
  <g fill="#9FB0CC" opacity="0.75">
    <circle cx="452" cy="270" r="26"/><circle cx="520" cy="228" r="27"/><circle cx="600" cy="214" r="26"/><circle cx="676" cy="232" r="25"/>
    <circle cx="420" cy="350" r="27"/><circle cx="440" cy="432" r="26"/><circle cx="510" cy="482" r="27"/><circle cx="596" cy="496" r="26"/><circle cx="676" cy="476" r="25"/>
  </g>
  <!-- Büyümüş, vurgulanan folikül -->
  <circle cx="452" cy="270" r="17" fill="url(#lnf_germ)"/>
  <circle cx="510" cy="482" r="12" fill="#E4EAF3"/><circle cx="600" cy="214" r="12" fill="#E4EAF3"/><circle cx="420" cy="350" r="12" fill="#E4EAF3"/><circle cx="676" cy="476" r="11" fill="#E4EAF3"/><circle cx="676" cy="232" r="11" fill="#E4EAF3"/><circle cx="520" cy="228" r="12" fill="#E4EAF3"/><circle cx="440" cy="432" r="12" fill="#E4EAF3"/><circle cx="596" cy="496" r="12" fill="#E4EAF3"/>
  <g fill="none" stroke="url(#lnf_gold)" stroke-linecap="round">
    <circle cx="452" cy="270" r="40" stroke-width="3" opacity="0.8"/>
    <circle cx="452" cy="270" r="56" stroke-width="2.5" opacity="0.4" stroke-dasharray="3 9"/>
  </g>

  <!-- Lenfositler -->
  <g>
    <g transform="translate(880 200)"><circle r="24" fill="#F2F5FA" opacity="0.9"/><circle cx="2" cy="-1" r="17" fill="#9FB0CC"/></g>
    <g transform="translate(960 470)"><circle r="20" fill="#F2F5FA" opacity="0.85"/><circle cx="-2" cy="1" r="14" fill="#9FB0CC"/></g>
    <g transform="translate(860 540)"><circle r="15" fill="#F2F5FA" opacity="0.7"/><circle cx="1" cy="1" r="10.5" fill="#9FB0CC"/></g>
    <g transform="translate(1050 220)"><circle r="16" fill="#F2F5FA" opacity="0.6"/><circle cx="1" cy="-1" r="11" fill="#9FB0CC"/></g>
    <g transform="translate(250 470)"><circle r="17" fill="#F2F5FA" opacity="0.65"/><circle cx="1" cy="1" r="12" fill="#9FB0CC"/></g>
    <g transform="translate(220 250)"><circle r="12" fill="#F2F5FA" opacity="0.5"/><circle r="8.5" fill="#9FB0CC"/></g>
    <g transform="translate(800 140)"><circle r="13" fill="#E8C56A" opacity="0.85"/><circle cx="1" cy="0" r="9" fill="#C99A34"/></g>
    <g transform="translate(1040 540)"><circle r="12" fill="#E8C56A" opacity="0.7"/><circle r="8" fill="#C99A34"/></g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
