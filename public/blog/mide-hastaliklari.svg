      <path d="M30 0 C 40 -6 46 4 56 -2 M30 0 C 40 8 48 2 56 10" stroke="#E8C56A" stroke-width="2.5" opacity="0.85"/>
    </g>
    <g transform="translate(560 452) rotate(-35)">
      <path d="M-20 0 C -15 -8 -10 -8 -5 0 C 0 8 5 8 10 0 C 15 -8 20 -8 25 0" stroke="url(#mde_gold)" stroke-width="8"/>
      <path d="M25 0 C 33 -5 38 3 46 -2 M25 0 C 33 7 40 2 46 8" stroke="#E8C56A" stroke-width="2.2" opacity="0.85"/>
