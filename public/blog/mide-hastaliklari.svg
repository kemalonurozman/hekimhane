<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Mide hastalıkları — stilize mide ve yemek borusu şeması, yukarı doğru yükselen altın dalga çizgisi ve sarmal biçimli bakteriler">
  <defs>
    <linearGradient id="mde_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="mde_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="mde_organ" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="mde_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <clipPath id="mde_clip"><path d="M572 250 C 584 196 650 168 708 198 C 764 228 776 304 764 376 C 750 456 690 516 604 516 C 540 516 494 486 468 446 L 434 452 L 426 412 L 476 404 C 512 398 548 380 566 350 C 584 318 582 286 572 250 Z"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#mde_bg)"/>
  <rect width="1200" height="675" fill="url(#mde_glow)"/>
  <circle cx="1070" cy="575" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1020" cy="115" r="150" fill="#fff" opacity="0.025"/>

  <!-- Yemek borusu -->
  <path d="M549 -10 C 554 100 566 190 580 262" fill="none" stroke="#C7D2E4" stroke-width="46" stroke-linecap="butt"/>
  <path d="M549 -10 C 554 100 566 190 580 262" fill="none" stroke="#E4EAF3" stroke-width="30" stroke-linecap="butt"/>
  <!-- Onikiparmak bağırsağı -->
  <path d="M440 432 C 400 436 380 460 384 500 C 388 540 420 560 460 556" fill="none" stroke="#C7D2E4" stroke-width="36" stroke-linecap="round"/>

  <!-- Mide -->
  <path d="M572 250 C 584 196 650 168 708 198 C 764 228 776 304 764 376 C 750 456 690 516 604 516 C 540 516 494 486 468 446 L 434 452 L 426 412 L 476 404 C 512 398 548 380 566 350 C 584 318 582 286 572 250 Z" fill="url(#mde_organ)"/>
  <g clip-path="url(#mde_clip)" fill="none" stroke="#9FB0CC" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M610 260 C 650 300 700 320 740 330"/>
    <path d="M600 330 C 640 380 690 400 750 400"/>
    <path d="M560 410 C 600 450 650 470 720 470"/>
    <path d="M500 432 C 530 460 570 480 620 490"/>
  </g>
  <!-- Pilor halkası -->
  <path d="M470 400 L 466 450" stroke="#9FB0CC" stroke-width="8" stroke-linecap="round"/>
  <!-- Parlama -->
  <path d="M620 210 C 660 196 700 206 724 236" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- Reflü dalgası -->
  <path d="M582 300 C 566 280 590 262 574 242 C 558 222 582 204 566 184 C 552 166 574 148 560 128 C 550 112 566 98 556 84" fill="none" stroke="url(#mde_gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M544 100 L 556 78 L 570 98" fill="none" stroke="#E8C56A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- H. pylori bakterileri -->
  <g fill="none" stroke-linecap="round">
    <g transform="translate(660 300) rotate(-20)">
      <path d="M-24 0 C -18 -10 -12 -10 -6 0 C 0 10 6 10 12 0 C 18 -10 24 -10 30 0" stroke="url(#mde_gold)" stroke-width="9"/>
      <path d="M30 0 C 40 -6 46 4 56 -2 M30 0 C 40 8 48 2 56 10" stroke="#E8C56A" stroke-width="2.5" opacity="0.85"/>
