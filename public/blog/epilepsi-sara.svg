<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Epilepsi — stilize beyin şeması üzerinde altın renkli elektriksel boşalma ve altında sivri dalgalı EEG çizgisi">
