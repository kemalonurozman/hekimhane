<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Egzama ve deri bariyeri — bir yanı aralıklı ve kuru, diğer yanı nemlendiriciyle dolmuş tuğla duvar biçiminde deri bariyeri ve su damlası">
  <defs>
    <linearGradient id="egz_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="egz_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="egz_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="egz_brick" gradientUnits="userSpaceOnUse" x1="0" y1="270" x2="0" y2="530"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="egz_drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#B6C8E4"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#egz_bg)"/>
  <rect width="1200" height="675" fill="url(#egz_glow)"/>
  <circle cx="1080" cy="580" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="160" cy="600" r="170" fill="#fff" opacity="0.025"/>

  <!-- Alt katman -->
  <rect x="180" y="540" width="840" height="34" rx="12" fill="#5B7299" opacity="0.45"/>

  <!-- Sağ: harcı tamamlanmış bariyer -->
  <g opacity="0.9"><rect x="553" y="266" width="469" height="54" fill="url(#egz_gold)"/><rect x="620" y="320" width="402" height="54" fill="url(#egz_gold)"/><rect x="553" y="374" width="469" height="54" fill="url(#egz_gold)"/><rect x="620" y="428" width="402" height="54" fill="url(#egz_gold)"/><rect x="553" y="482" width="469" height="54" fill="url(#egz_gold)"/></g>
  <g fill="url(#egz_brick)"><rect x="561.0" y="270.0" width="112.0" height="46" rx="10"/><rect x="687.0" y="270.0" width="112.0" height="46" rx="10"/><rect x="813.0" y="270.0" width="112.0" height="46" rx="10"/><rect x="939.0" y="270.0" width="78.0" height="46" rx="10"/><rect x="628.0" y="324.0" width="112.0" height="46" rx="10"/><rect x="754.0" y="324.0" width="112.0" height="46" rx="10"/><rect x="880.0" y="324.0" width="112.0" height="46" rx="10"/><rect x="561.0" y="378.0" width="112.0" height="46" rx="10"/><rect x="687.0" y="378.0" width="112.0" height="46" rx="10"/><rect x="813.0" y="378.0" width="112.0" height="46" rx="10"/><rect x="939.0" y="378.0" width="78.0" height="46" rx="10"/><rect x="628.0" y="432.0" width="112.0" height="46" rx="10"/><rect x="754.0" y="432.0" width="112.0" height="46" rx="10"/><rect x="880.0" y="432.0" width="112.0" height="46" rx="10"/><rect x="561.0" y="486.0" width="112.0" height="46" rx="10"/><rect x="687.0" y="486.0" width="112.0" height="46" rx="10"/><rect x="813.0" y="486.0" width="112.0" height="46" rx="10"/><rect x="939.0" y="486.0" width="78.0" height="46" rx="10"/></g>

  <!-- Sol: aralıkları açılmış kuru bariyer -->
  <g fill="url(#egz_brick)" opacity="0.92"><rect x="181.2" y="273.4" width="108.8" height="39.9" rx="9" transform="rotate(1.5 239.0 293.0)"/><rect x="306.5" y="272.3" width="109.5" height="40.4" rx="9" transform="rotate(0.1 365.0 293.0)"/><rect x="252.1" y="329.9" width="103.4" height="36.3" rx="9" transform="rotate(-3.8 306.0 347.0)"/><rect x="383.1" y="324.6" width="105.4" height="37.6" rx="9" transform="rotate(-1.0 432.0 347.0)"/><rect x="501.1" y="325.9" width="107.7" height="39.1" rx="9" transform="rotate(-3.6 558.0 347.0)"/><rect x="185.8" y="380.1" width="108.6" height="39.7" rx="9" transform="rotate(0.8 239.0 401.0)"/><rect x="307.9" y="382.3" width="109.5" height="40.3" rx="9" transform="rotate(-4.4 365.0 401.0)"/><rect x="436.9" y="379.9" width="107.5" height="39.0" rx="9" transform="rotate(0.9 491.0 401.0)"/><rect x="187.4" y="436.7" width="45.4" height="36.9" rx="9" transform="rotate(-2.6 209.5 455.0)"/><rect x="257.8" y="433.6" width="104.2" height="36.8" rx="9" transform="rotate(-2.1 306.0 455.0)"/><rect x="379.9" y="433.0" width="103.9" height="36.6" rx="9" transform="rotate(-3.5 432.0 455.0)"/><rect x="509.1" y="435.2" width="103.9" height="36.6" rx="9" transform="rotate(0.7 558.0 455.0)"/><rect x="186.0" y="493.0" width="105.2" height="37.5" rx="9" transform="rotate(0.8 239.0 509.0)"/><rect x="308.4" y="491.5" width="106.2" height="38.1" rx="9" transform="rotate(1.6 365.0 509.0)"/><rect x="438.2" y="490.4" width="102.1" height="35.4" rx="9" transform="rotate(3.2 491.0 509.0)"/></g>

  <!-- Soldan kaçan nem -->
  <g fill="#9DB4D6" opacity="0.8">
    <path d="M300 200 C 300 200 288 216 288 224 a 12 12 0 0 0 24 0 C 312 216 300 200 300 200 Z"/>
    <path d="M420 160 C 420 160 410 173 410 180 a 10 10 0 0 0 20 0 C 430 173 420 160 420 160 Z" opacity="0.7"/>
    <path d="M360 120 C 360 120 352 130 352 136 a 8 8 0 0 0 16 0 C 368 130 360 120 360 120 Z" opacity="0.5"/>
    <path d="M500 214 C 500 214 491 226 491 232 a 9 9 0 0 0 18 0 C 509 226 500 214 500 214 Z" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#9DB4D6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.6">
    <path d="M300 262 L 300 240"/><path d="M420 262 L 420 196"/><path d="M500 262 L 500 246"/>
  </g>

  <!-- Sağda koruyucu su damlası -->
  <path d="M810 70 C 810 70 742 150 742 192 a 68 68 0 0 0 136 0 C 878 150 810 70 810 70 Z" fill="url(#egz_drop)"/>
  <path d="M776 186 a 36 36 0 0 0 26 40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <g fill="none" stroke="#E8C56A" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M720 238 C 760 252 860 252 900 238"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
