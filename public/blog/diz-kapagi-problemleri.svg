<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Önden görülen diz ekleminde uyluk ve kaval kemiği arasında altın renkle vurgulanmış diz kapağı">
  <defs>
    <linearGradient id="dizk_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="dizk_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="dizk_bone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7D2E4"/><stop offset="0.45" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="dizk_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="dizk_hot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.45"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dizk_bg)"/>
  <rect width="1200" height="675" fill="url(#dizk_glow)"/>
  <circle cx="1060" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1000" cy="110" r="150" fill="#fff" opacity="0.025"/>
  <circle cx="170" cy="590" r="170" fill="#fff" opacity="0.025"/>

  <!-- Bacak silueti -->
  <path d="M455 -10 C 452 120 440 230 448 330 C 454 400 470 450 478 500 C 486 560 486 620 490 690 L 710 690 C 714 620 714 560 722 500 C 730 450 746 400 752 330 C 760 230 748 120 745 -10 Z" fill="#fff" opacity="0.06"/>

  <!-- Uyluk kemiği (femur) -->
  <path d="M556 -10 L 644 -10 L 646 230 C 650 280 690 300 700 340 C 708 372 702 404 682 412 C 660 420 640 408 626 396 C 614 388 586 388 574 396 C 560 408 540 420 518 412 C 498 404 492 372 500 340 C 510 300 550 280 554 230 Z" fill="url(#dizk_bone)"/>
  <!-- Menisküsler -->
  <g fill="#9DB4D6">
    <path d="M500 414 C 520 424 560 424 584 418 L 584 428 L 498 428 Z"/>
    <path d="M700 414 C 680 424 640 424 616 418 L 616 428 L 702 428 Z"/>
  </g>
  <!-- Kaval kemiği (tibia) -->
  <path d="M492 432 L 708 432 C 716 440 714 456 704 466 C 680 490 652 510 646 560 L 642 690 L 562 690 L 558 560 C 552 510 520 490 496 466 C 486 456 484 440 492 432 Z" fill="url(#dizk_bone)"/>
  <!-- Kamış kemiği (fibula), dış yanda -->
  <path d="M462 470 C 470 456 494 456 502 468 C 508 480 500 496 494 506 L 492 690 L 470 690 L 468 506 C 460 496 456 482 462 470 Z" fill="url(#dizk_bone)" opacity="0.92"/>

  <!-- Uyluk kası tendonu ve diz kapağı tendonu -->
  <path d="M556 150 L 644 150 L 636 280 L 564 280 Z" fill="#C7D2E4" opacity="0.35"/>
  <path d="M586 352 L 614 352 L 622 500 L 578 500 Z" fill="#E4EAF3" opacity="0.75"/>
  <ellipse cx="600" cy="506" rx="26" ry="12" fill="#C7D2E4"/>

  <!-- Dışa kayma: hayalet diz kapağı ve ok -->
  <path transform="translate(600 300) scale(0.88) translate(-600 -335)" d="M478 270 C 516 262 544 276 548 300 C 552 330 536 368 512 392 C 506 398 498 398 492 392 C 468 368 452 330 456 300 C 458 284 466 274 478 270 Z" fill="none" stroke="#E8C56A" stroke-width="3" stroke-dasharray="6 9" opacity="0.6"/>
  <path d="M556 200 C 536 186 514 186 496 200" fill="none" stroke="#E8C56A" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M496 200 L 510 202 M 496 200 L 501 187" fill="none" stroke="#E8C56A" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Diz kapağı (patella) -->
  <circle cx="600" cy="300" r="105" fill="url(#dizk_hot)"/>
  <g transform="translate(600 300) scale(0.88) translate(-600 -335)">
  
  <path d="M586 262 C 630 254 664 270 668 300 C 673 336 652 380 622 406 C 612 414 588 414 578 406 C 548 380 527 336 532 300 C 535 280 552 266 586 262 Z" fill="url(#dizk_gold)"/>
  <path d="M572 290 C 590 280 616 280 632 292" fill="none" stroke="#FFF7E0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  </g>
  <!-- Hafif ışıma halkaları -->
  <g fill="none" stroke="#E8C56A" stroke-linecap="round">
    <path d="M690 236 A 110 110 0 0 1 694 358" stroke-width="3.5" opacity="0.7"/>
    <path d="M726 212 A 146 146 0 0 1 732 382" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
