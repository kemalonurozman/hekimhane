<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Ben kontrolü — cilt yüzeyindeki düzenli benler arasında büyüteçle incelenen, kenarları düzensiz ve çok renkli bir ben">
  <defs>
    <linearGradient id="ben_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="ben_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <radialGradient id="ben_glow" cx="0.55" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <linearGradient id="ben_skin" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="580"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <clipPath id="ben_lens"><circle cx="690" cy="360" r="118"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#ben_bg)"/>
  <rect width="1200" height="675" fill="url(#ben_glow)"/>
  <circle cx="1080" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="100" r="150" fill="#fff" opacity="0.025"/>

  <!-- Cilt yüzeyi -->
  <path d="M200 242 C 380 194 820 186 1050 232 C 1074 237 1086 256 1084 280 L 1066 520 C 1064 546 1046 562 1020 564 C 760 586 420 588 210 556 C 184 552 168 534 168 508 L 168 276 C 168 258 182 247 200 242 Z" fill="url(#ben_skin)"/>
  <g fill="none" stroke="#B6C3DA" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
    <path d="M230 300 C 300 290 360 296 420 290"/><path d="M260 480 C 330 470 400 478 470 470"/>
    <path d="M880 290 C 940 284 990 290 1030 286"/><path d="M860 500 C 920 494 980 500 1030 494"/>
    <path d="M300 400 C 340 394 380 398 410 392"/>
  </g>

  <!-- Düzenli benler -->
  <g fill="#7F93B5">
    <circle cx="300" cy="350" r="11"/><circle cx="420" cy="455" r="9"/><circle cx="470" cy="300" r="12"/>
    <circle cx="250" cy="500" r="8"/><circle cx="900" cy="350" r="11"/><circle cx="975" cy="470" r="10"/>
    <circle cx="1010" cy="300" r="8"/><circle cx="560" cy="520" r="9"/><circle cx="860" cy="520" r="8"/>
  </g>
  <g fill="#9FB0CC"><circle cx="297" cy="347" r="4"/><circle cx="467" cy="297" r="4"/><circle cx="897" cy="347" r="4"/></g>

  <!-- Büyüteç: mercek içi büyütülmüş görüntü -->
  <circle cx="690" cy="360" r="118" fill="#F7F9FC"/>
  <g clip-path="url(#ben_lens)">
    <path d="M640 330 C 652 292 700 286 728 304 C 760 322 752 350 744 366 C 736 384 754 404 730 424 C 708 442 680 428 664 420 C 640 410 618 404 622 378 C 625 360 634 350 640 330 Z" fill="#8496B6"/>
    <path d="M660 330 C 676 312 704 314 716 330 C 728 346 712 360 706 376 C 700 392 680 396 668 384 C 654 370 648 344 660 330 Z" fill="#3E5A86"/>
    <path d="M708 386 C 722 382 734 394 728 408 C 722 420 704 418 700 406 C 697 396 700 389 708 386 Z" fill="#2A4E82"/>
    <ellipse cx="690" cy="404" rx="12" ry="8" fill="#D6DEEA"/>
    <circle cx="738" cy="346" r="7" fill="#5B7299"/>
    <line x1="690" y1="262" x2="690" y2="458" stroke="#fff" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.9"/>
  </g>
  <path d="M610 290 A 108 108 0 0 1 700 252" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <!-- Mercek çerçevesi ve sap -->
  <g transform="translate(690 360) rotate(45)">
    <rect x="128" y="-20" width="44" height="40" rx="8" fill="#C99A34"/>
    <rect x="168" y="-24" width="150" height="48" rx="24" fill="url(#ben_gold)"/>
  </g>
  <circle cx="690" cy="360" r="126" fill="none" stroke="url(#ben_gold)" stroke-width="18"/>

  <!-- Dikkat halkası -->
  <circle cx="690" cy="360" r="152" fill="none" stroke="#E8C56A" stroke-width="2.5" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.55"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
