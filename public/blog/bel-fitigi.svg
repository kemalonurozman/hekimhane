<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yandan görülen bel omurları arasında arkaya taşan altın renkli disk ve sıkışan sinir kökü çizimi">
  <defs>
    <linearGradient id="belf_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="belf_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="belf_bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="belf_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
    <radialGradient id="belf_hot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8C56A" stop-opacity="0.55"/><stop offset="1" stop-color="#E8C56A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#belf_bg)"/>
  <rect width="1200" height="675" fill="url(#belf_glow)"/>
  <circle cx="1060" cy="570" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="1010" cy="120" r="150" fill="#fff" opacity="0.025"/>
  <circle cx="190" cy="560" r="170" fill="#fff" opacity="0.025"/>

  <g transform="translate(-40 0)">
  <!-- Omurilik kanalı ve sinir demeti -->
  <path d="M735 -10 C 722 110 690 200 688 290 C 686 380 690 450 708 530 C 722 590 748 640 772 690" fill="none" stroke="#9DB4D6" stroke-width="34" stroke-linecap="round" opacity="0.35"/>
  <path d="M735 -10 C 722 110 690 200 688 290 C 686 380 690 450 708 530 C 722 590 748 640 772 690" fill="none" stroke="#C7D2E4" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Diskler -->
  <g fill="#9DB4D6">
    <rect x="-98" y="-22" width="196" height="44" rx="20" transform="translate(588 216) rotate(-4)"/>
    <rect x="-98" y="-22" width="196" height="44" rx="20" transform="translate(573 346) rotate(0.5)"/>
    <rect x="-98" y="-22" width="196" height="44" rx="20" transform="translate(612 606) rotate(16)"/>
  </g>
  <!-- Omurlar: gövde + pedikül + arka kemer -->
  <g fill="url(#belf_bone)">
    <g transform="translate(600 150) rotate(-6)">
      <rect x="-96" y="-47" width="192" height="94" rx="18"/>
      <rect x="88" y="-42" width="56" height="30" rx="9"/>
      <path d="M138 -48 C 172 -52 200 -44 226 -30 L 300 6 C 314 13 312 36 296 38 L 222 36 C 190 34 162 26 140 16 C 132 0 132 -32 138 -48 Z"/>
    </g>
    <g transform="translate(576 281) rotate(-2)">
      <rect x="-96" y="-47" width="192" height="94" rx="18"/>
      <rect x="88" y="-42" width="56" height="30" rx="9"/>
      <path d="M138 -48 C 172 -52 200 -44 226 -30 L 300 6 C 314 13 312 36 296 38 L 222 36 C 190 34 162 26 140 16 C 132 0 132 -32 138 -48 Z"/>
    </g>
    <g transform="translate(572 411) rotate(3)">
      <rect x="-96" y="-47" width="192" height="94" rx="18"/>
      <rect x="88" y="-42" width="56" height="30" rx="9"/>
      <path d="M138 -48 C 172 -52 200 -44 226 -30 L 300 6 C 314 13 312 36 296 38 L 222 36 C 190 34 162 26 140 16 C 132 0 132 -32 138 -48 Z"/>
    </g>
    <g transform="translate(592 541) rotate(9)">
      <rect x="-96" y="-47" width="192" height="94" rx="18"/>
      <rect x="88" y="-42" width="56" height="30" rx="9"/>
      <path d="M138 -48 C 172 -52 200 -44 226 -30 L 300 6 C 314 13 312 36 296 38 L 222 36 C 190 34 162 26 140 16 C 132 0 132 -32 138 -48 Z"/>
    </g>
    <g transform="translate(640 680) rotate(24)">
      <rect x="-96" y="-47" width="192" height="94" rx="18"/>
    </g>
  </g>
  <!-- Gövde iç dokusu -->
  <g fill="none" stroke="#9FB0CC" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <path d="M530 140 L 660 126" /><path d="M520 170 L 650 156"/>
    <path d="M512 274 L 640 270"/><path d="M512 302 L 640 298"/>
    <path d="M512 400 L 640 406"/><path d="M510 428 L 638 434"/>
    <path d="M534 528 L 660 548"/><path d="M528 556 L 652 576"/>
  </g>

  <!-- Fıtıklaşan disk (L4-L5) -->
  <g transform="translate(580 476) rotate(6)">
    <rect x="-96" y="-17" width="192" height="34" rx="16" fill="url(#belf_gold)"/>
    <path d="M84 -14 C 116 -18 140 -6 143 6 C 146 18 126 26 98 21 C 90 19 85 16 84 14 Z" fill="url(#belf_gold)"/>
    <ellipse cx="0" cy="0" rx="60" ry="7" fill="#FFF7E0" opacity="0.55"/>
  </g>
  <!-- Sıkışan sinir kökü -->
  <circle cx="716" cy="492" r="92" fill="url(#belf_hot)"/>
  <path d="M706 488 C 690 540 664 600 650 690" fill="none" stroke="#C7D2E4" stroke-width="11" stroke-linecap="round"/>
  <path d="M706 488 C 700 510 692 530 684 548" fill="none" stroke="url(#belf_gold)" stroke-width="11" stroke-linecap="round"/>

  <!-- Tahriş halkaları -->
  <g fill="none" stroke="#E8C56A" stroke-linecap="round">
    <path d="M748 446 A 46 46 0 0 1 760 520" stroke-width="3.5" opacity="0.8"/>
    <path d="M770 426 A 74 74 0 0 1 786 540" stroke-width="3" opacity="0.5"/>
    <path d="M792 406 A 102 102 0 0 1 812 560" stroke-width="2.5" opacity="0.28"/>
  </g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
