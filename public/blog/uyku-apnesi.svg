<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yastık üzerinde burun maskesi, hortumla bağlı CPAP cihazı ve düzene giren altın renkli oksijen eğrisi">
  <defs>
    <linearGradient id="osa_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="osa_gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="osa_gold2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="osa_light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="osa_pillow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB4D6"/><stop offset="1" stop-color="#6F8DB8"/></linearGradient>
    <linearGradient id="osa_screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325C"/><stop offset="1" stop-color="#0E2240"/></linearGradient>
    <radialGradient id="osa_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#osa_bg)"/>
  <rect width="1200" height="675" fill="url(#osa_glow)"/>
  <circle cx="1080" cy="590" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="160" cy="560" r="170" fill="#fff" opacity="0.025"/>

  <!-- Hilal -->
  <path d="M1068 70 A 46 46 0 1 0 1112 134 A 36 36 0 1 1 1068 70 Z" fill="url(#osa_gold2)"/>

  <!-- Oksijen eğrisi: önce düşüşler, sonra düzenli -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="300" y1="200" x2="1000" y2="200" stroke="#9DB4D6" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.4"/>
    <path d="M300 200 L 340 200 C 352 200 356 262 372 262 C 386 262 388 200 402 200 L 430 200 C 442 200 446 276 462 276 C 476 276 478 200 492 200 L 516 200 C 528 200 532 254 548 254 C 562 254 564 200 578 200 L 608 200 C 618 200 620 238 632 238 C 642 238 644 200 654 200" stroke="#9DB4D6" stroke-width="5" opacity="0.75"/>
    <path d="M654 200 C 690 200 700 186 740 186 L 1000 186" stroke="url(#osa_gold)" stroke-width="6"/>
    <circle cx="740" cy="186" r="9" fill="url(#osa_gold2)" stroke="none"/>
  </g>

  <!-- Yastık -->
  <path d="M250 500 C 240 448 320 428 470 432 C 620 436 700 448 704 500 C 708 556 620 578 470 576 C 320 574 258 552 250 500 Z" fill="url(#osa_pillow)"/>
  <path d="M300 470 C 380 458 560 458 650 472" fill="none" stroke="#DCE4F0" stroke-width="3" opacity="0.35"/>

  <!-- Maske kayışları -->
  <path d="M400 488 C 360 420 380 360 450 352 C 520 344 560 380 548 440" fill="none" stroke="#C7D2E4" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <path d="M420 500 C 410 530 450 548 500 540 C 540 534 566 510 560 486" fill="none" stroke="#C7D2E4" stroke-width="10" stroke-linecap="round" opacity="0.75"/>

  <!-- Burun maskesi -->
  <g transform="translate(486 448)">
    <path d="M0 -62 C 22 -62 56 18 54 38 C 52 54 32 60 0 60 C -32 60 -52 54 -54 38 C -56 18 -22 -62 0 -62 Z" fill="url(#osa_light)"/>
    <path d="M0 -44 C 14 -44 38 16 36 30 C 34 40 22 44 0 44 C -22 44 -34 40 -36 30 C -38 16 -14 -44 0 -44 Z" fill="#9FB0CC" opacity="0.55"/>
    <rect x="-14" y="54" width="28" height="30" rx="8" fill="#C7D2E4"/>
  </g>

  <!-- Hortum -->
  <path d="M486 530 C 486 610 620 620 720 590 C 800 566 820 520 860 506" fill="none" stroke="#9DB4D6" stroke-width="18" stroke-linecap="round"/>
  <path d="M486 530 C 486 610 620 620 720 590 C 800 566 820 520 860 506" fill="none" stroke="#C7D2E4" stroke-width="18" stroke-linecap="butt" stroke-dasharray="3 9" opacity="0.6"/>

  <!-- CPAP cihazı -->
  <g transform="translate(850 404)">
    <rect x="0" y="0" width="220" height="150" rx="30" fill="url(#osa_light)"/>
    <rect x="0" y="108" width="220" height="42" rx="20" fill="#9DB4D6" opacity="0.6"/>
    <rect x="96" y="28" width="98" height="56" rx="12" fill="url(#osa_screen)"/>
    <path d="M108 60 L 128 60 L 136 46 L 146 70 L 154 56 L 182 56" fill="none" stroke="url(#osa_gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="56" r="24" fill="#C7D2E4"/>
    <circle cx="50" cy="56" r="12" fill="url(#osa_gold2)"/>
    <rect x="-14" y="88" width="24" height="30" rx="8" fill="#C7D2E4"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
