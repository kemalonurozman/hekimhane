<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yandan görülen kafatası ve alt çene modelinde altın kesik çizgilerle işaretlenmiş osteotomi hatları ve dişler arasına yerleşen şeffaf cerrahi splint çizimi">
  <defs>
    <linearGradient id="adcp_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="adcp_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="adcp_bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <linearGradient id="adcp_tooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
    <radialGradient id="adcp_glow" cx="0.6" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#adcp_bg)"/>
  <rect width="1200" height="675" fill="url(#adcp_glow)"/>
  <circle cx="1080" cy="590" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="170" cy="570" r="170" fill="#fff" opacity="0.025"/>

  <!-- 3B eksenler -->
  <g stroke-linecap="round" opacity="0.55">
    <line x1="1010" y1="560" x2="1090" y2="560" stroke="#9DB4D6" stroke-width="3"/>
    <line x1="1010" y1="560" x2="1010" y2="480" stroke="#9DB4D6" stroke-width="3"/>
    <line x1="1010" y1="560" x2="962" y2="602" stroke="#E8C56A" stroke-width="3"/>
  </g>

  <!-- Kafatası (üst bölüm, soyut) -->
  <path d="M470 270 C 440 200 470 120 560 92 C 660 62 800 70 880 120 C 950 164 975 230 960 300 L 905 300 C 880 270 850 255 820 252 L 800 232 L 520 232 C 500 238 482 252 470 270 Z" fill="url(#adcp_bone)" opacity="0.22"/>
  <path d="M470 270 C 440 200 470 120 560 92 C 660 62 800 70 880 120 C 950 164 975 230 960 300" fill="none" stroke="#9DB4D6" stroke-width="2.5" opacity="0.6"/>
  <!-- Orbita -->
  <ellipse cx="560" cy="190" rx="42" ry="34" fill="#12294B" opacity="0.55" stroke="#9DB4D6" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Üst çene -->
  <path d="M470 300 C 466 270 482 244 522 234 L 800 234 C 818 262 816 322 804 372 L 524 378 C 496 374 476 346 470 300 Z" fill="url(#adcp_bone)" opacity="0.95"/>
  <!-- Alt çene -->
  <path d="M484 404 C 470 444 456 484 466 522 C 476 560 540 572 604 562 L 840 542 C 882 536 906 516 906 482 L 916 300 C 919 270 906 250 890 246 C 878 243 868 252 866 266 C 860 290 850 300 838 296 C 828 292 822 272 818 252 C 810 274 800 332 796 392 L 796 406 L 522 408 Z" fill="url(#adcp_bone)" opacity="0.95"/>

  <!-- Alt çene kanalı -->
  <path d="M884 316 C 872 380 840 440 760 470 C 690 494 620 498 566 490" fill="none" stroke="#9DB4D6" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="566" cy="490" r="7" fill="#9DB4D6" opacity="0.7"/>

  <!-- Dişler -->
  <g fill="url(#adcp_tooth)">
    <rect x="498" y="352" width="24" height="40" rx="9"/><rect x="526" y="352" width="26" height="40" rx="9"/><rect x="556" y="354" width="30" height="38" rx="9"/>
    <rect x="590" y="356" width="34" height="36" rx="9"/><rect x="628" y="356" width="40" height="36" rx="10"/><rect x="672" y="356" width="46" height="36" rx="10"/><rect x="722" y="356" width="46" height="36" rx="10"/>
    <rect x="502" y="402" width="22" height="38" rx="9"/><rect x="528" y="402" width="26" height="38" rx="9"/><rect x="558" y="402" width="30" height="36" rx="9"/>
    <rect x="592" y="402" width="34" height="34" rx="9"/><rect x="630" y="402" width="40" height="34" rx="10"/><rect x="674" y="402" width="46" height="34" rx="10"/><rect x="724" y="402" width="46" height="34" rx="10"/>
  </g>

  <!-- Cerrahi splint -->
  <rect x="488" y="386" width="292" height="22" rx="10" fill="#EEF2F8" opacity="0.3"/>
  <rect x="488" y="386" width="292" height="22" rx="10" fill="none" stroke="#EEF2F8" stroke-width="2.5" opacity="0.9"/>

  <!-- Osteotomi hatları -->
  <g fill="none" stroke="#E8C56A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10">
    <path d="M474 300 L 812 300"/>
    <path d="M876 334 L 812 340 L 774 414 L 764 548"/>
    <path d="M462 488 C 500 502 540 510 584 514"/>
  </g>
  <!-- Hareket okları -->
  <g fill="none" stroke="#E8C56A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M420 330 L 380 330"/><path d="M392 318 L 378 330 L 392 342"/>
    <path d="M430 520 L 390 530"/><path d="M400 516 L 388 530 L 404 540"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">DİJİTAL HEKİMLİK</text>
  </g>
</svg>
