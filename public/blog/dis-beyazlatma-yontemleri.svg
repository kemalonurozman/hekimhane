<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diş beyazlatma yöntemleri — parlayan beyaz diş ve renk skalası simgesi">
  <defs>
    <linearGradient id="e_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="e_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="e_shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9A24B"/><stop offset="0.5" stop-color="#E9DCB6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="e_glow" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#e_bg)"/>
  <rect width="1200" height="675" fill="url(#e_glow)"/>
  <circle cx="1050" cy="130" r="210" fill="#fff" opacity="0.035"/>
  <circle cx="160" cy="570" r="180" fill="#fff" opacity="0.03"/>

  <!-- Sparkling tooth -->
  <g transform="translate(500 320) scale(1.6)">
    <path d="M0 -72 C -46 -72 -84 -44 -84 2 C -84 40 -72 70 -58 92 C -49 106 -35 108 -29 92 C -22 74 -14 66 0 66 C 14 66 22 74 29 92 C 35 108 49 106 58 92 C 72 70 84 40 84 2 C 84 -44 46 -72 0 -72 Z" fill="#FFFFFF"/>
    <path d="M-50 -60 C -38 -78 -12 -80 6 -70" fill="none" stroke="#DCE4F0" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Sparkles -->
  <g fill="url(#e_gold)">
    <path d="M660 210 l 10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z"/>
    <path d="M710 330 l 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M300 250 l 5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.8"/>
  </g>

  <!-- Shade guide -->
  <g transform="translate(360 500)">
    <rect x="0" y="0" width="480" height="60" rx="14" fill="url(#e_shade)"/>
    <g stroke="#12294B" stroke-opacity="0.18" stroke-width="2"><line x1="120" y1="6" x2="120" y2="54"/><line x1="240" y1="6" x2="240" y2="54"/><line x1="360" y1="6" x2="360" y2="54"/></g>
    <rect x="360" y="-6" width="120" height="72" rx="12" fill="none" stroke="url(#e_gold)" stroke-width="4"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
