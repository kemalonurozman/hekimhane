<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diş implantı tedavisi — çene kemiğine yerleştirilen titanyum vida ve protez diş kesiti">
  <defs>
    <linearGradient id="b_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="b_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="b_metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C7D2E4"/><stop offset="0.5" stop-color="#F2F5FA"/><stop offset="1" stop-color="#9FB0CC"/></linearGradient>
    <radialGradient id="b_glow" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#b_bg)"/>
  <rect width="1200" height="675" fill="url(#b_glow)"/>
  <circle cx="1060" cy="120" r="220" fill="#fff" opacity="0.035"/>
  <circle cx="160" cy="580" r="180" fill="#fff" opacity="0.03"/>

  <!-- Gum arc -->
  <g transform="translate(600 470)">
    <path d="M-360 40 C -220 -70 220 -70 360 40 L 360 150 L -360 150 Z" fill="#EBA9A0" opacity="0.9"/>
    <path d="M-360 40 C -220 -70 220 -70 360 40" fill="none" stroke="#F3C9C2" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- Neighbor teeth -->
  <g fill="#EEF2F8" opacity="0.85">
    <path d="M330 430 c -26 0 -40 22 -40 48 c 0 34 14 78 30 78 c 10 0 12 -22 22 -22 c 10 0 12 22 22 22 c 16 0 30 -44 30 -78 c 0 -26 -14 -48 -40 -48 z" transform="translate(-40 -12) scale(0.8)"/>
    <path d="M330 430 c -26 0 -40 22 -40 48 c 0 34 14 78 30 78 c 10 0 12 -22 22 -22 c 10 0 12 22 22 22 c 16 0 30 -44 30 -78 c 0 -26 -14 -48 -40 -48 z" transform="translate(560 -12) scale(0.8)"/>
  </g>

  <!-- Implant: crown + abutment + screw -->
  <g transform="translate(600 300)">
    <!-- Crown -->
    <path d="M0 -96 C -52 -96 -78 -60 -78 -20 C -78 16 -64 44 -46 44 C -34 44 -30 24 0 24 C 30 24 34 44 46 44 C 64 44 78 16 78 -20 C 78 -60 52 -96 0 -96 Z" fill="#FFFFFF"/>
    <path d="M-44 -56 C -34 -72 -12 -74 2 -66" fill="none" stroke="#D5DEEC" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <!-- Abutment -->
    <path d="M-22 44 L 22 44 L 14 96 L -14 96 Z" fill="url(#b_gold)"/>
    <!-- Screw threads -->
    <g>
      <path d="M-20 100 L 20 100 L 16 128 L -16 128 Z" fill="url(#b_metal)"/>
      <path d="M-16 132 L 16 132 L 12 158 L -12 158 Z" fill="url(#b_metal)"/>
      <path d="M-12 162 L 12 162 L 8 186 L -8 186 Z" fill="url(#b_metal)"/>
      <path d="M-8 190 L 8 190 L 0 214 L 0 214 Z" fill="url(#b_metal)"/>
      <g stroke="#8CA0BE" stroke-width="2.4" opacity="0.65">
        <line x1="-18" y1="112" x2="18" y2="112"/><line x1="-15" y1="144" x2="15" y2="144"/><line x1="-11" y1="172" x2="11" y2="172"/>
      </g>
    </g>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
