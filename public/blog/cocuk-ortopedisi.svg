<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Yuvasına oturan kalça eklemi şeması, kemer çizgisi işaretli ayak izi ve O ile X dizilimindeki stilize çocuk bacakları">
  <defs>
    <linearGradient id="cor_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="cor_gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="cor_bone" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="600"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#C7D2E4"/></linearGradient>
    <radialGradient id="cor_glow" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cor_bg)"/>
  <rect width="1200" height="675" fill="url(#cor_glow)"/>
  <circle cx="1080" cy="580" r="200" fill="#fff" opacity="0.03"/>
  <circle cx="1000" cy="100" r="140" fill="#fff" opacity="0.025"/>

  <!-- Zemin dairesi -->
  <circle cx="320" cy="390" r="190" fill="#fff" opacity="0.035"/>

  <!-- Kalça eklemi: yuva + uyluk başı -->
  <g>
    <!-- leğen kemiği parçası -->
    <path d="M250 205 C 300 185 380 190 420 215 C 440 240 432 290 412 318 C 398 300 370 286 330 284 C 290 286 262 300 248 318 C 232 290 232 232 250 205 Z" fill="url(#cor_bone)" opacity="0.9"/>
    <!-- yuva (asetabulum) -->
    <path d="M262 336 C 270 290 300 270 330 270 C 360 270 390 290 398 336" fill="none" stroke="url(#cor_gold)" stroke-width="12" stroke-linecap="round"/>
    <!-- uyluk kemiği -->
    <path d="M306 380 C 300 400 280 418 262 430 C 250 438 246 452 254 464 C 262 476 282 478 298 474 L 338 584 Q 362 600 384 584 L 352 470 C 346 446 342 420 346 396 Z" fill="url(#cor_bone)"/>
    <circle cx="330" cy="340" r="50" fill="#F2F5FA"/>
    <circle cx="330" cy="340" r="50" fill="none" stroke="#9DB4D6" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- Ayak izi (sağ ayak tabanı) -->
  <g transform="translate(600 360)">
    <path d="M-38 -110 C -10 -130 40 -122 52 -86 C 62 -54 46 -18 40 14 C 34 48 48 86 40 118 C 32 150 -6 160 -28 140 C -48 122 -44 84 -46 52 C -48 18 -64 -18 -62 -54 C -60 -80 -54 -100 -38 -110 Z" fill="#E4EAF3"/>
    <!-- kemer bölgesi -->
    <path d="M-46 -10 C -24 0 -20 40 -40 70" fill="none" stroke="url(#cor_gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 13"/>
    <!-- parmaklar: başparmak içte (solda) -->
    <ellipse cx="-40" cy="-150" rx="17" ry="21" fill="#E4EAF3"/>
    <ellipse cx="-6" cy="-160" rx="11" ry="13" fill="#E4EAF3"/>
    <ellipse cx="18" cy="-154" rx="10" ry="12" fill="#E4EAF3"/>
    <ellipse cx="38" cy="-142" rx="9" ry="11" fill="#E4EAF3"/>
    <ellipse cx="54" cy="-126" rx="8" ry="9.5" fill="#E4EAF3"/>
  </g>

  <!-- O bacak -->
  <g fill="none" stroke="#C7D2E4" stroke-width="22" stroke-linecap="round">
    <path d="M790 220 C 755 300 755 400 788 486"/>
    <path d="M860 220 C 895 300 895 400 862 486"/>
  </g>
  <g fill="#C7D2E4">
    <ellipse cx="776" cy="500" rx="26" ry="12"/>
    <ellipse cx="874" cy="500" rx="26" ry="12"/>
  </g>
  <g fill="url(#cor_gold)"><circle cx="764" cy="352" r="9"/><circle cx="886" cy="352" r="9"/></g>

  <!-- X bacak -->
  <g fill="none" stroke="#C7D2E4" stroke-width="22" stroke-linecap="round">
    <path d="M978 220 C 990 290 1004 330 1005 352 C 1004 382 990 432 968 486"/>
    <path d="M1062 220 C 1050 290 1036 330 1035 352 C 1036 382 1050 432 1072 486"/>
  </g>
  <g fill="#C7D2E4">
    <ellipse cx="956" cy="500" rx="26" ry="12"/>
    <ellipse cx="1084" cy="500" rx="26" ry="12"/>
  </g>
  <g fill="url(#cor_gold)"><circle cx="1005" cy="352" r="8"/><circle cx="1035" cy="352" r="8"/></g>

  <!-- Zemin çizgisi -->
  <line x1="740" y1="526" x2="1110" y2="526" stroke="#9DB4D6" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
