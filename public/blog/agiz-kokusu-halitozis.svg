<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Ağız kokusu (halitozis) nedenleri — diş, nane yaprağı ve tazelik simgesi">
  <defs>
    <linearGradient id="f_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A69"/><stop offset="1" stop-color="#12294B"/></linearGradient>
    <linearGradient id="f_gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8C56A"/><stop offset="1" stop-color="#C99A34"/></linearGradient>
    <linearGradient id="f_mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FD4A6"/><stop offset="1" stop-color="#3FA875"/></linearGradient>
    <radialGradient id="f_glow" cx="0.5" cy="0.42" r="0.7"><stop offset="0" stop-color="#2A4E82" stop-opacity="0.85"/><stop offset="1" stop-color="#12294B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#f_bg)"/>
  <rect width="1200" height="675" fill="url(#f_glow)"/>
  <circle cx="1050" cy="550" r="210" fill="#fff" opacity="0.03"/>
  <circle cx="170" cy="130" r="170" fill="#fff" opacity="0.03"/>

  <!-- Tooth -->
  <g transform="translate(520 350) scale(1.55)">
    <path d="M0 -72 C -46 -72 -84 -44 -84 2 C -84 40 -72 70 -58 92 C -49 106 -35 108 -29 92 C -22 74 -14 66 0 66 C 14 66 22 74 29 92 C 35 108 49 106 58 92 C 72 70 84 40 84 2 C 84 -44 46 -72 0 -72 Z" fill="#FFFFFF"/>
    <path d="M-50 -60 C -38 -78 -12 -80 6 -70" fill="none" stroke="#DCE4F0" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Mint leaves -->
  <g transform="translate(660 250)">
    <path d="M0 0 C 60 -40 130 -20 150 40 C 90 60 20 40 0 0 Z" fill="url(#f_mint)"/>
    <path d="M8 6 C 55 -18 105 -8 132 34" fill="none" stroke="#2C7B54" stroke-width="4" opacity="0.6"/>
    <path d="M-10 30 C 40 10 96 30 110 84 C 56 96 4 78 -10 30 Z" fill="url(#f_mint)" opacity="0.92"/>
    <path d="M-2 38 C 40 26 82 42 100 78" fill="none" stroke="#2C7B54" stroke-width="4" opacity="0.55"/>
  </g>

  <!-- Freshness waves -->
  <g fill="none" stroke="url(#f_gold)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M770 400 C 810 380 810 430 850 410"/>
    <path d="M780 450 C 826 428 826 484 872 462"/>
    <path d="M760 350 C 796 332 796 378 832 360" opacity="0.6"/>
  </g>

  <!-- Marka -->
  <g transform="translate(72 60)" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
    <rect width="34" height="34" rx="9" fill="#fff"/><rect x="8" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="21" y="9" width="5" height="16" rx="2" fill="#1B3A69"/><rect x="8" y="15" width="18" height="4.6" rx="2" fill="#D4A843"/>
    <text x="46" y="16" font-size="15.5" font-weight="700" fill="#fff" letter-spacing="0.3">hekimhane</text>
    <text x="46" y="31" font-size="10" font-weight="600" fill="#9DB4D6" letter-spacing="1.4">SAĞLIK REHBERİ</text>
  </g>
</svg>
