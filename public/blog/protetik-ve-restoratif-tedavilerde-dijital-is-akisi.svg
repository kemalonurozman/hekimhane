      <circle cx="-140" cy="120" r="3"/><circle cx="-138" cy="50" r="3"/><circle cx="-126" cy="-8" r="3"/><circle cx="-104" cy="-46" r="3"/><circle cx="-72" cy="-70" r="3"/><circle cx="-30" cy="-80" r="3"/><circle cx="30" cy="-80" r="3"/><circle cx="72" cy="-70" r="3"/><circle cx="104" cy="-46" r="3"/><circle cx="126" cy="-8" r="3"/><circle cx="138" cy="50" r="3"/><circle cx="140" cy="120" r="3"/>
