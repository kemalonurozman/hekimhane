<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Dişetinden yükselen kesilmiş bir diş güdüğü, altın renkli bitim çizgisi ve üzerine inen ağ yüzeyli kron ile arkada tarama ağıyla çizilmiş diş arkını gösteren çizim">
