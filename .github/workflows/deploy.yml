name: Vercel Production Deploy

# main'e her push'ta üretime otomatik deploy.
# Tek gereksinim: GitHub repo → Settings → Secrets and variables → Actions
# altına VERCEL_TOKEN eklenmesi. Org/Proje ID'leri gizli değildir, aşağıda açık.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions sekmesinden elle de tetiklenebilir

env:
  VERCEL_ORG_ID: team_I8PcC1phML6b9qWVzL806H3A
  VERCEL_PROJECT_ID: prj_e04ZXkyw6amk2PjdrfkEXSDfMit9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
